; Ramp Control Tower - panel.cfg
; Each [VCockpitNN] paints an HTML gauge onto the 3D material named in texture=. The screen
; materials ($SCREEN_*) are made by blender/build_ramp_tower.py; the pages are the VATFLOW tower
; screens from msfs-tower/package/html_ui (htmlgauge paths are relative to
; html_ui/Pages/VCockpit/Instruments/), so that html_ui folder has to be in the package too.
; Every 1024x768 screen runs the screen host (Screen/S_<id>.html): it starts on its own app and
; the MENU tab in its corner switches it to any other (RAMP, ramp maps, ASDE-X, DBRITE, VATSMART, ...).

; Ramp 1 (left window): ramp list
[VCockpit01]
size_mm=1024,768
pixel_size=1024,768
texture=$SCREEN_RAMP
background_color=0,0,0
htmlgauge00=VatflowTower/Screen/S_RAMP.html, 0,0,1024,768

; Ramp 1 (left window): ramp map E / D
[VCockpit02]
size_mm=1024,768
pixel_size=1024,768
texture=$SCREEN_RAMPMAP_ED
background_color=0,0,0
htmlgauge00=VatflowTower/Screen/S_RAMPMAP_ED.html, 0,0,1024,768


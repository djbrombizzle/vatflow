# Refresh data/event-history.json (each US field's recent VATSIM events from
# StatSim) for the Airport TMU Event planner. Weekly, or run it by hand.
name: Event history

on:
  schedule:
    # Every Tuesday 06:45 UTC
    - cron: "45 6 * * 2"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: event-history
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build event history
        env:
          # optional: adds where each event's arrivals came from
          STATSIM_API_KEY: ${{ secrets.STATSIM_API_KEY }}
        run: |
          set -euo pipefail
          node scripts/build-event-history.mjs 2>&1 | tee "${RUNNER_TEMP}/event-history.log"
          grep -q '^done$' "${RUNNER_TEMP}/event-history.log"
          test -s data/event-history.json

      - name: Commit
        run: |
          set -euo pipefail
          if git diff --quiet -- data/event-history.json; then
            echo "No change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/event-history.json
          git commit -m "Event history: refresh from StatSim"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep $((i * 5))
          done
          exit 1

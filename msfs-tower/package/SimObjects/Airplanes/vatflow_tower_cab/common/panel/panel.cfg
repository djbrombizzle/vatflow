; VATFLOW Tower Cab - panel.cfg
; Each [VCockpitNN] paints an HTML gauge onto the 3D material named in texture=.
; The Blender script names the screen materials $SCREEN_DBRITE, $SCREEN_TWRINFO, $SCREEN_ASDEX, $SCREEN_IDST, $SCREEN_CLOCK and $SCREEN_VSCS (with the $, as in the SDK GaugeAircraft sample).
; htmlgauge paths are relative to html_ui/Pages/VCockpit/Instruments/.

[VCockpit01]
size_mm=1024,768
pixel_size=1024,768
texture=$SCREEN_DBRITE
background_color=0,0,0
htmlgauge00=VatflowTower/Dbrite/Dbrite.html, 0,0,1024,768

[VCockpit02]
size_mm=1024,512
pixel_size=1024,512
texture=$SCREEN_TWRINFO
background_color=0,0,0
htmlgauge00=VatflowTower/TwrInfo/TwrInfo.html, 0,0,1024,512

[VCockpit03]
size_mm=768,1024
pixel_size=768,1024
texture=$SCREEN_ASDEX
background_color=0,0,0
htmlgauge00=VatflowTower/Asdex/Asdex.html, 0,0,768,1024

[VCockpit04]
size_mm=1024,768
pixel_size=1024,768
texture=$SCREEN_IDST
background_color=0,0,0
htmlgauge00=VatflowTower/Idst/Idst.html, 0,0,1024,768

[VCockpit05]
size_mm=512,128
pixel_size=512,128
texture=$SCREEN_CLOCK
background_color=0,0,0
htmlgauge00=VatflowTower/Clock/Clock.html, 0,0,512,128

[VCockpit06]
size_mm=512,384
pixel_size=512,384
texture=$SCREEN_VSCS
background_color=0,0,0
htmlgauge00=VatflowTower/Vscs/Vscs.html, 0,0,512,384

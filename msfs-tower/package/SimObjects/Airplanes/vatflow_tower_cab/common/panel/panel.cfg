; VATFLOW Tower Cab - panel.cfg
; Each [VCockpitNN] paints an HTML gauge onto the 3D material named in texture=.
; The Blender script names the screen materials $SCREEN_DBRITE, $SCREEN_TWRINFO, $SCREEN_ASDEX, $SCREEN_IDST, $SCREEN_CLOCK, $SCREEN_VSCS, $SCREEN_TMUARR, $SCREEN_TMUDEP, $SCREEN_CLOCK2, $SCREEN_RAMP, $SCREEN_TMUIDS and $SCREEN_RAMPMAP_ED / _CB / _AS (with the $, as in the SDK GaugeAircraft sample).
; htmlgauge paths are relative to html_ui/Pages/VCockpit/Instruments/.

[VCockpit01]
size_mm=1024,768
pixel_size=1024,768
texture=$SCREEN_DBRITE
background_color=0,0,0
htmlgauge00=VatflowTower/Dbrite/Dbrite.html, 0,0,1024,768

[VCockpit02]
size_mm=1024,512
pixel_size=1024,512
texture=$SCREEN_TWRINFO

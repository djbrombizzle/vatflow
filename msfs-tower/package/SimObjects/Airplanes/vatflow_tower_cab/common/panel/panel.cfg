; VATFLOW Tower Cab - panel.cfg
; Each [VCockpitNN] paints an HTML gauge onto the 3D material named in texture=.
; The Blender script names the screen materials $SCREEN_DBRITE, $SCREEN_TWRINFO, $SCREEN_ASDEX, $SCREEN_IDST, $SCREEN_CLOCK, $SCREEN_VSCS, $SCREEN_APTDEMAND, $SCREEN_APTLIST, $SCREEN_CLOCK2, $SCREEN_RAMP, $SCREEN_VATSMART, $SCREEN_RAMPMAP_ED / _CB / _AS, $SCREEN_STRIPS_1..3 (strip bays) and $SCREEN_SIGN_1..3 (their position signs) (with the $, as in the SDK GaugeAircraft sample).
; htmlgauge paths are relative to html_ui/Pages/VCockpit/Instruments/.
; Every 1024x768 screen runs the screen host (Screen/S_<id>.html): it shows one app, picked with
; the MENU tab in the screen's corner (DBRITE, ASDE-X, IDST, VATSMART, APT dashboard, SETUP ...).

[VCockpit01]
size_mm=1024,768
pixel_size=1024,768
texture=$SCREEN_DBRITE
background_color=0,0,0
htmlgauge00=VatflowTower/Screen/S_DBRITE.html, 0,0,1024,768

[VCockpit02]
size_mm=1024,512
pixel_size=1024,512
texture=$SCREEN_TWRINFO

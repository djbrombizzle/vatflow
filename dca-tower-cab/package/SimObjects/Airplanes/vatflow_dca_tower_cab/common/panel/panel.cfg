; DCA Tower Cab - panel.cfg
; Each [VCockpitNN] paints an HTML gauge onto the 3D material named in texture=.
; The two overhead monitors: $SCREEN_DBRITE (Tower Radar, starts front right) and
; $SCREEN_ASDEX (Ground Radar, starts front left), named the same in build_dca_tower_cab.py.
; htmlgauge paths are relative to html_ui/Pages/VCockpit/Instruments/. Both run the screen
; host (VatflowDcaTower/Screen/S_<id>.html): its MENU tab in the corner picks the app,
; TOWER SETUP among them (place / move the cab in the tower).

[VCockpit01]
size_mm=1024,768
pixel_size=1024,768
texture=$SCREEN_DBRITE
background_color=0,0,0
htmlgauge00=VatflowDcaTower/Screen/S_DBRITE.html, 0,0,1024,768

[VCockpit02]
size_mm=1024,768
pixel_size=1024,768
texture=$SCREEN_ASDEX
background_color=0,0,0
htmlgauge00=VatflowDcaTower/Screen/S_ASDEX.html, 0,0,1024,768

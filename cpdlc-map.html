<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CPDLC Map — VATFLOW</title>
<link rel="stylesheet" href="shared/vatflow-nav.css">
<style>
  :root {
    --bg: #050505;
    --fg: #cfcfcf;
    --fg-dim: #6b6b6b;
    --cyan: #3fb7b0;
    --green: #79d27a;
    --line: #333;
    --vatflow-nav-h: 28px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: var(--bg); color: var(--fg);
    font-family: "Cascadia Mono", "Cascadia Code", Consolas, "SF Mono", Menlo, monospace;
  }
  #vatflowAppNav { position: fixed; top: 0; left: 0; right: 0; z-index: 50; }

  #mapPage {
    position: fixed;
    top: var(--vatflow-nav-h);
    left: 0; right: 0; bottom: 0;
    display: flex;
    flex-direction: column;
    background: #0b0b0b;
  }
  .map-hdr {
    display: flex; align-items: center; gap: 12px;
    padding: 8px 14px; background: #161616; border-bottom: 1px solid #444;
    flex-shrink: 0;
  }
  .map-hdr .title { color: #fff; letter-spacing: 0.4px; font-size: 14px; }
  .map-hdr .sub { color: var(--fg-dim); font-size: 11px; }
  .map-hdr .stats { margin-left: auto; color: var(--fg-dim); font-size: 12px; white-space: nowrap; }

  #mapLegend {
    display: flex; gap: 18px; padding: 6px 14px; font-size: 11px;
    color: var(--fg-dim); border-bottom: 1px solid #222; flex-wrap: wrap; flex-shrink: 0;
  }
  .map-leg { display: flex; align-items: center; gap: 6px; }
  .map-leg .swatch { width: 14px; height: 10px; border: 1px solid #555; display: inline-block; }
  .map-leg .swatch.staffed { background: rgba(121, 210, 122, 0.35); border-color: var(--green); }
  .map-leg .dot-swatch { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .map-leg .dot-swatch.on { background: #9ef09f; }
  .map-leg .dot-swatch.off { background: #666; opacity: 0.5; }

  #mapWrap {
    flex: 1; min-height: 0; background: #050505; padding: 6px;
    position: relative; overflow: hidden; touch-action: none;
  }
  #mapSvg { width: 100%; height: 100%; display: block; cursor: grab; }
  #mapSvg.map-dragging { cursor: grabbing; }
  #mapZoom {
    position: absolute; right: 14px; bottom: 14px;
    display: flex; flex-direction: column; gap: 4px; z-index: 2;
  }
  #mapZoom button {
    width: 28px; height: 28px; background: #1a1a1a; border: 1px solid #555;
    color: #cfcfcf; font-size: 16px; line-height: 1; padding: 0; cursor: pointer;
  }
  #mapZoom button:hover { background: #262626; }
  #mapZoom .map-zoom-hint {
    color: #6b6b6b; font-size: 10px; text-align: center; line-height: 1.2;
    max-width: 76px; margin-top: 2px;
  }

  .map-artcc { fill: #0d0d0d; stroke: #333; stroke-width: 0.9; vector-effect: non-scaling-stroke; }
  .map-artcc-staffed { fill: rgba(121, 210, 122, 0.2); stroke: var(--green); stroke-width: 1.5; }
  .map-artcc-mine { stroke: var(--cyan); stroke-width: 1.6; }
  .map-ac { fill: #777; stroke: #999; stroke-width: 0.5; opacity: 0.5; }
  .map-ac-conn { fill: #9ef09f; stroke: #d4ffd5; stroke-width: 0.7; }
</style>
</head>
<body>
<div id="vatflowAppNav"></div>

<div id="mapPage">
  <div class="map-hdr">
    <span class="title">LIVE MAP</span>
    <span class="sub">vUSAlink CPDLC · view only · no login required · includes ZAN / ZHN (HCF)</span>
    <span class="stats" id="mapStats">loading&hellip;</span>
  </div>
  <div id="mapLegend">
    <span class="map-leg"><span class="swatch staffed"></span> center using vUSAlink CPDLC</span>
    <span class="map-leg"><span class="dot-swatch on"></span> aircraft on KUSA</span>
    <span class="map-leg"><span class="dot-swatch off"></span> other VATSIM traffic</span>
    <span class="map-leg">ARTCC HIGH boundaries (local FAA / VAT-Spy fallback)</span>
  </div>
  <div id="mapWrap">
    <svg id="mapSvg" viewBox="0 0 960 600" preserveAspectRatio="xMidYMid meet" aria-label="USA ARTCC map"></svg>
    <div id="mapZoom" aria-label="Map zoom controls">
      <button type="button" id="mapZoomIn" title="Zoom in">+</button>
      <button type="button" id="mapZoomOut" title="Zoom out">&minus;</button>
      <button type="button" id="mapZoomReset" title="Reset to CONUS">⌂</button>
      <div class="map-zoom-hint">scroll / drag</div>
    </div>
  </div>
</div>

<script type="module">
import { mountVatflowNav } from "./shared/vatflow-nav.js";
mountVatflowNav(document.getElementById("vatflowAppNav"), "cpdlc-map");
</script>
<script>
// Copied from vusalink LIVE MAP — same projection, hub payload, and styling.
const DEFAULT_HUB_URL = "https://web-production-3d9fe.up.railway.app";
function hubBase() { return DEFAULT_HUB_URL; }
function esc(s) {
  return (s || "").replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
}

// Prefer repo HIGH-stratum polygons (no oceanic FIRs). VAT-Spy is fallback only.
const MAP_BND_LOCAL = "data/artcc-boundaries-high.geojson";
const MAP_BND_URL = "https://raw.githubusercontent.com/vatsimnetwork/vatspy-data-project/master/Boundaries.geojson";
// Non-KZ** US centers for VAT-Spy fallback. Do NOT include KZAK/KZWY (oceanic).
const US_ARTCC_EXTRA = new Set(["PAZA", "PHZH", "TJZS"]);
const OCEANIC_EXCLUDE = new Set(["KZAK", "KZWY", "ZAK", "ZWY"]);
// World covers CONUS + Alaska (incl. Aleutians west of 180°) + Hawaii.
const MAP_WORLD = { minLon: -205, maxLon: -60, minLat: 15, maxLat: 85, w: 2400, h: 1200, m: 16 };
const MAP_HOME = { minLon: -130, maxLon: -63, minLat: 22, maxLat: 52 };
const ARTCC_ID_ALIASES = { PAZA: "ZAN", PHZH: "ZHN", TJZS: "ZUA", HCF: "ZHN", ANC: "ZAN", HNL: "ZHN" };
/** Strip ICAO K prefix / alias VAT-Spy ids so hub PAZA matches local ZAN. */
function normArtccId(id) {
  let s = (id || "").toUpperCase().trim();
  if (!s) return "";
  if (ARTCC_ID_ALIASES[s]) return ARTCC_ID_ALIASES[s];
  s = s.replace(/^K(?=Z)/, "");
  return ARTCC_ID_ALIASES[s] || s;
}
function isOceanicProp(p) {
  const o = p && p.oceanic;
  return o === true || o === 1 || o === "1";
}
function isUsArtccFeature(f) {
  const p = f.properties || {};
  const id = (p.id || "").toUpperCase();
  if (!id || !f.geometry) return false;
  if (OCEANIC_EXCLUDE.has(id) || isOceanicProp(p)) return false;
  // Exact center FIR only (drops KZNY-W, KZNY-BDA, KZMA-OCN, …)
  if (/^KZ[A-Z]{2}$/.test(id) || /^Z[A-Z]{2}$/.test(id)) return true;
  return US_ARTCC_EXTRA.has(id);
}
function geomToMultiPolys(geom) {
  if (!geom) return [];
  if (geom.type === "Polygon") return [geom.coordinates];
  if (geom.type === "MultiPolygon") return geom.coordinates.slice();
  return [];
}
function mergeGeom(a, b) {
  const coords = geomToMultiPolys(a).concat(geomToMultiPolys(b));
  if (!coords.length) return a || b;
  return { type: "MultiPolygon", coordinates: coords };
}
let mapBoundaryGeoms = null, mapTimer = null, mapLoading = false;
let mapCam = null, mapDrag = null;

function wrapMapLon(lon) { return lon > 0 ? lon - 360 : lon; }
function mapProj(lon, lat) {
  lon = wrapMapLon(lon);
  const bw = MAP_WORLD.w - 2 * MAP_WORLD.m, bh = MAP_WORLD.h - 2 * MAP_WORLD.m;
  const x = MAP_WORLD.m + (lon - MAP_WORLD.minLon) / (MAP_WORLD.maxLon - MAP_WORLD.minLon) * bw;
  const y = MAP_WORLD.m + (MAP_WORLD.maxLat - lat) / (MAP_WORLD.maxLat - MAP_WORLD.minLat) * bh;
  return [x, y];
}
function mapHomeCam() {
  const [x0, y0] = mapProj(MAP_HOME.minLon, MAP_HOME.maxLat);
  const [x1, y1] = mapProj(MAP_HOME.maxLon, MAP_HOME.minLat);
  return { x: x0, y: y0, w: Math.max(1, x1 - x0), h: Math.max(1, y1 - y0) };
}
function ensureMapCam() { if (!mapCam) mapCam = mapHomeCam(); return mapCam; }
function applyMapCam() {
  const svg = document.getElementById("mapSvg");
  if (!svg) return;
  const c = ensureMapCam();
  svg.setAttribute("viewBox", `${c.x} ${c.y} ${c.w} ${c.h}`);
}
function clampMapCam() {
  const c = ensureMapCam();
  const maxW = MAP_WORLD.w, maxH = MAP_WORLD.h;
  c.w = Math.min(Math.max(c.w, 40), maxW);
  c.h = Math.min(Math.max(c.h, 30), maxH);
  c.x = Math.min(Math.max(c.x, 0), Math.max(0, maxW - c.w));
  c.y = Math.min(Math.max(c.y, 0), Math.max(0, maxH - c.h));
}
function mapZoomAt(clientX, clientY, factor) {
  const svg = document.getElementById("mapSvg");
  if (!svg) return;
  const c = ensureMapCam();
  const rect = svg.getBoundingClientRect();
  if (rect.width <= 0 || rect.height <= 0) return;
  const px = (clientX - rect.left) / rect.width;
  const py = (clientY - rect.top) / rect.height;
  const ax = c.x + px * c.w, ay = c.y + py * c.h;
  c.w *= factor; c.h *= factor;
  clampMapCam();
  c.x = ax - px * c.w; c.y = ay - py * c.h;
  clampMapCam();
  applyMapCam();
}
function mapZoomCenter(factor) {
  const svg = document.getElementById("mapSvg");
  if (!svg) return;
  const rect = svg.getBoundingClientRect();
  mapZoomAt(rect.left + rect.width / 2, rect.top + rect.height / 2, factor);
}
function mapRingPath(ring) {
  if (!ring || !ring.length) return "";
  return ring.map((pt, i) => {
    const xy = mapProj(pt[0], pt[1]);
    return (i ? "L" : "M") + xy[0].toFixed(1) + "," + xy[1].toFixed(1);
  }).join(" ") + " Z";
}
function mapGeomPaths(geom) {
  const out = [];
  const polys = geom.type === "Polygon" ? [geom.coordinates] :
    geom.type === "MultiPolygon" ? geom.coordinates : [];
  for (const poly of polys) for (const ring of poly) out.push(mapRingPath(ring));
  return out;
}
function ingestBoundaryFeatures(features, fromVatspy) {
  const out = {};
  for (const f of features || []) {
    if (fromVatspy && !isUsArtccFeature(f)) continue;
    const raw = (f.properties && f.properties.id || "").toUpperCase();
    if (!raw || !f.geometry) continue;
    // Local HIGH files already exclude oceanic; still skip if flagged.
    if (isOceanicProp(f.properties) || OCEANIC_EXCLUDE.has(raw)) continue;
    const id = normArtccId(raw);
    if (!id) continue;
    out[id] = out[id] ? mergeGeom(out[id], f.geometry) : f.geometry;
  }
  return out;
}
async function loadMapBoundaries() {
  if (mapBoundaryGeoms) return mapBoundaryGeoms;
  try {
    const r = await fetch(MAP_BND_LOCAL);
    if (r.ok) {
      const gj = await r.json();
      const local = ingestBoundaryFeatures(gj.features || [], false);
      if (Object.keys(local).length) {
        mapBoundaryGeoms = local;
        return mapBoundaryGeoms;
      }
    }
  } catch (e) { /* fall through to VAT-Spy */ }
  const r = await fetch(MAP_BND_URL);
  const gj = await r.json();
  mapBoundaryGeoms = ingestBoundaryFeatures(gj.features || [], true);
  return mapBoundaryGeoms;
}
async function fetchMapData() {
  const res = await fetch(hubBase() + "/hub/map", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: "{}",
  });
  let data;
  try { data = await res.json(); } catch (e) { throw new Error("hub map response invalid"); }
  if (!res.ok) throw new Error((data && data.error) || ("hub map HTTP " + res.status));
  return data;
}
/** Miami North-only CTR positions (VAT-Spy KZMA-N): MIA_N / MIA_N1..N9 / ZMA_CTR. */
function isMiaNorthOnlyCallsign(cs) {
  cs = (cs || "").toUpperCase();
  return /^MIA_N\d*_CTR$/.test(cs) || cs === "ZMA_CTR";
}
/** Any Miami ARTCC CTR/FSS family callsign (MIA / ZMA / ZMO). */
function isMiaFamilyCallsign(cs) {
  cs = (cs || "").toUpperCase();
  if (!(cs.endsWith("_CTR") || cs.endsWith("_FSS"))) return false;
  return /^(MIA|ZMA|ZMO)_/.test(cs);
}
/**
 * CPDLC Miami highlight scope for LIVE MAP:
 *  - 'north' — only MIA_N*_CTR (or ZMA_CTR) online → highlight ZMA-N only
 *  - 'full'  — any other MIA CTR (or ZMO) → full ZMA incl. oceanic to SJU
 *  - null    — no Miami CPDLC controllers
 */
function miaMapScope(controllers) {
  const mia = [];
  for (const c of controllers || []) {
    const cs = (c.callsign || "").toUpperCase();
    if (isMiaFamilyCallsign(cs)) mia.push(cs);
  }
  if (!mia.length) return null;
  return mia.every(isMiaNorthOnlyCallsign) ? "north" : "full";
}
function renderMapSvg(bnd, data, statsEl) {
  const svg = document.getElementById("mapSvg");
  if (!svg) return;
  const staffed = new Set(((data && data.staffed) || []).map(normArtccId));
  const flights = (data && data.flights) || [];
  const onKusa = flights.filter(f => f.connected).length;
  const myArtcc = ""; // view-only page — no controller highlight
  const controllers = (data && data.controllers) || [];
  const miaScope = miaMapScope(controllers);
  const ctrlByArtcc = {};
  const miaCallsigns = [];
  controllers.forEach(c => {
    if (c.artcc && c.callsign) {
      const id = normArtccId(c.artcc);
      ctrlByArtcc[id] = c.callsign;
      if (isMiaFamilyCallsign(c.callsign)) {
        miaCallsigns.push(c.callsign);
        ctrlByArtcc["ZMA"] = c.callsign;
        ctrlByArtcc["ZMA-N"] = c.callsign;
      }
    }
  });
  if (statsEl) {
    const hubNote = data ? "" : " · traffic unavailable";
    statsEl.textContent =
      `${flights.length} a/c · ${onKusa} on KUSA · ${staffed.size} CPDLC center${staffed.size === 1 ? "" : "s"}${hubNote}`;
  }
  let html = "";
  Object.keys(bnd).sort().forEach(id => {
    // ZMA-N is a highlight overlay only — drawn after the full ZMA outline.
    if (id === "ZMA-N") return;
    let cls = "map-artcc";
    let lit = staffed.has(id);
    if (id === "ZMA") {
      if (miaScope === "full") lit = true;
      else if (miaScope === "north") lit = false;
      else lit = staffed.has("ZMA") || staffed.has("ZMA-OCN");
    }
    if (lit) cls += " map-artcc-staffed";
    if (myArtcc && id === myArtcc) cls += " map-artcc-mine";
    let tip = id;
    if (id === "ZMA" && miaCallsigns.length) tip += " · CPDLC: " + miaCallsigns.join(", ");
    else if (lit) tip += " · CPDLC: " + (ctrlByArtcc[id] || "active");
    mapGeomPaths(bnd[id]).forEach(d => {
      if (d) html += `<path class="${cls}" data-artcc="${id}" d="${d}"><title>${esc(tip)}</title></path>`;
    });
  });
  // North-only CPDLC: light ZMA-N (domestic) without the oceanic corridor to SJU.
  if (miaScope === "north" && bnd["ZMA-N"]) {
    const tip = "ZMA-N · CPDLC: " + (miaCallsigns.join(", ") || ctrlByArtcc["ZMA-N"] || "active");
    mapGeomPaths(bnd["ZMA-N"]).forEach(d => {
      if (d) html += `<path class="map-artcc map-artcc-staffed" data-artcc="ZMA-N" d="${d}"><title>${esc(tip)}</title></path>`;
    });
  }
  flights.forEach(f => {
    if (f.lat == null || f.lon == null) return;
    const xy = mapProj(f.lon, f.lat);
    const cls = f.connected ? "map-ac-conn" : "map-ac";
    const art = f.artcc ? normArtccId(f.artcc) : "";
    const tip = `${f.callsign} FL${f.fl || "?"}${f.connected ? " · KUSA" : ""}${art ? " · " + art : ""}`;
    html += `<circle class="${cls}" cx="${xy[0].toFixed(1)}" cy="${xy[1].toFixed(1)}" r="2.5"><title>${esc(tip)}</title></circle>`;
  });
  svg.innerHTML = html;
  applyMapCam();
}
async function renderLiveMap() {
  const statsEl = document.getElementById("mapStats");
  const svg = document.getElementById("mapSvg");
  if (!svg || mapLoading) return;
  mapLoading = true;
  if (statsEl) statsEl.textContent = "loading…";
  try {
    let bnd, data, hubErr = "";
    try { bnd = await loadMapBoundaries(); }
    catch (e) { if (statsEl) statsEl.textContent = "boundaries load failed"; return; }
    try { data = await fetchMapData(); }
    catch (e) { hubErr = e.message || "hub map unavailable"; }
    if (!data || !data.ok) {
      hubErr = (data && data.error) || hubErr || "hub map unavailable";
      renderMapSvg(bnd, null, statsEl);
      if (statsEl) statsEl.textContent = hubErr + " · boundaries only";
      return;
    }
    renderMapSvg(bnd, data, statsEl);
  } catch (e) {
    if (statsEl) statsEl.textContent = (e && e.message) || "map load failed";
  } finally {
    mapLoading = false;
  }
}

(function bindLiveMapInteraction() {
  const svg = document.getElementById("mapSvg");
  const wrap = document.getElementById("mapWrap");
  if (!svg || !wrap) return;
  wrap.addEventListener("wheel", e => {
    e.preventDefault();
    const factor = e.deltaY > 0 ? 1.12 : 1 / 1.12;
    mapZoomAt(e.clientX, e.clientY, factor);
  }, { passive: false });
  svg.addEventListener("pointerdown", e => {
    if (e.button !== 0) return;
    const c = ensureMapCam();
    mapDrag = { id: e.pointerId, x: e.clientX, y: e.clientY, ox: c.x, oy: c.y };
    svg.classList.add("map-dragging");
    try { svg.setPointerCapture(e.pointerId); } catch (err) {}
  });
  svg.addEventListener("pointermove", e => {
    if (!mapDrag || e.pointerId !== mapDrag.id) return;
    const rect = svg.getBoundingClientRect();
    if (rect.width <= 0 || rect.height <= 0) return;
    const c = ensureMapCam();
    const dx = (e.clientX - mapDrag.x) / rect.width * c.w;
    const dy = (e.clientY - mapDrag.y) / rect.height * c.h;
    c.x = mapDrag.ox - dx; c.y = mapDrag.oy - dy;
    clampMapCam();
    applyMapCam();
  });
  function endDrag(e) {
    if (!mapDrag || (e && e.pointerId !== mapDrag.id)) return;
    mapDrag = null;
    svg.classList.remove("map-dragging");
  }
  svg.addEventListener("pointerup", endDrag);
  svg.addEventListener("pointercancel", endDrag);
  const zin = document.getElementById("mapZoomIn");
  const zout = document.getElementById("mapZoomOut");
  const zreset = document.getElementById("mapZoomReset");
  if (zin) zin.onclick = () => mapZoomCenter(1 / 1.25);
  if (zout) zout.onclick = () => mapZoomCenter(1.25);
  if (zreset) zreset.onclick = () => { mapCam = mapHomeCam(); applyMapCam(); };
})();

renderLiveMap();
mapTimer = setInterval(() => renderLiveMap(), 30000);
</script>
</body>
</html>

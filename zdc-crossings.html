<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>ZDC Crossings — VATFLOW</title>
<link rel="stylesheet" href="shared/vatflow-nav.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
  :root {
    --bg: #080b10;
    --panel: #0e1319;
    --panel2: #121922;
    --text: #d4dde6;
    --muted: #8a97a3;
    --dim: #5c6b78;
    --amber: #e8a838;
    --cyan: #3fb7b0;
    --green: #57d98a;
    --red: #e07070;
    --line: #1e2834;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    --ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --vatflow-nav-h: 28px;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); font-family: var(--ui); }
  #vatflowAppNav { position: fixed; top: 0; left: 0; right: 0; z-index: 700; }
  main { max-width: 1100px; margin: 0 auto; padding: calc(var(--vatflow-nav-h) + 20px) 16px 40px; }
  h1 { font-family: var(--mono); font-size: 18px; letter-spacing: 0.14em; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 12px; line-height: 1.5; margin: 0 0 16px; }
  .sub b { color: var(--text); font-weight: 600; }

  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
  select, input[type=text], button {
    font-family: var(--mono); font-size: 13px; color: var(--text); background: var(--panel);
    border: 1px solid #2a3644; border-radius: 6px; padding: 7px 10px;
  }
  input[type=text] { width: 220px; text-transform: uppercase; }
  button { cursor: pointer; }
  button:hover, select:hover { border-color: var(--amber); }
  button.on { border-color: var(--amber); color: var(--amber); }
  label.chk { font-family: var(--mono); font-size: 12px; color: var(--muted); display: inline-flex; gap: 5px; align-items: center; cursor: pointer; }
  .seg { display: inline-flex; }
  .seg button { border-radius: 0; }
  .seg button:first-child { border-radius: 6px 0 0 6px; }
  .seg button:last-child { border-radius: 0 6px 6px 0; }
  .status { font-family: var(--mono); font-size: 11px; color: var(--dim); margin-left: auto; }
  .status.err { color: var(--red); }

  .gate { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 24px; max-width: 520px; }
  .gate p { color: var(--muted); font-size: 13px; line-height: 1.5; }

  .ac { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; margin-bottom: 10px; overflow: hidden; }
  .ac-head { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: baseline; padding: 10px 14px; background: var(--panel2); border-bottom: 1px solid var(--line); }
  .cs { font-family: var(--mono); font-size: 16px; font-weight: 700; letter-spacing: 0.06em; }
  .meta { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .meta b { color: var(--text); font-weight: 600; }
  .tag { font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em; padding: 1px 6px; border-radius: 3px; border: 1px solid currentColor; }
  .tag.in { color: var(--green); }
  .tag.inb { color: var(--cyan); }
  .tag.gnd { color: var(--muted); }
  .tag.pre { color: var(--dim); }
  .route { font-family: var(--mono); font-size: 11px; color: var(--dim); padding: 6px 14px 0; overflow-wrap: anywhere; }
  .route mark { background: none; color: var(--amber); }

  table { width: 100%; border-collapse: collapse; font-family: var(--mono); font-size: 12px; }
  th { text-align: left; font-weight: 500; color: var(--dim); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; padding: 6px 10px; border-bottom: 1px solid var(--line); }
  td { padding: 6px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  tr:last-child td { border-bottom: none; }
  .ac table { margin-top: 6px; }
  td.restr { color: var(--amber); font-weight: 600; white-space: nowrap; }
  td.hand { white-space: nowrap; }
  td.hand .arrow { color: var(--dim); }
  .secname { color: var(--dim); font-size: 10px; }
  td.secname { white-space: nowrap; }
  tr.passed td { opacity: 0.45; }
  tr.partial td.restr::after { content: " ?"; color: var(--dim); }
  .note { color: var(--muted); font-size: 11px; }
  .q { font-size: 10px; letter-spacing: 0.06em; }
  .q.full { color: var(--green); }
  .q.partial { color: var(--muted); }
  .dv { padding: 8px 14px; font-family: var(--mono); font-size: 12px; color: var(--cyan); border-top: 1px solid var(--line); }
  .empty { color: var(--muted); font-size: 13px; padding: 24px 0; }
  .ref { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow-x: auto; }
  .foot { color: var(--dim); font-size: 11px; line-height: 1.6; margin-top: 18px; }

  .mapwrap { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 10px; height: calc(100vh - var(--vatflow-nav-h) - 190px); min-height: 420px; }
  #map { border: 1px solid var(--line); border-radius: 8px; background: #0a0e14; min-height: 0; }
  #map .leaflet-container, #map.leaflet-container { background: #0a0e14; font-family: var(--mono); }
  .mappanel { overflow-y: auto; min-height: 0; }
  .mappanel .ac { margin-bottom: 0; }
  .mappanel thead { display: none; }
  .mappanel tr { display: block; padding: 6px 0; border-bottom: 1px solid var(--line); }
  .mappanel tr:last-child { border-bottom: none; }
  .mappanel td { display: block; border: none; padding: 1px 12px; white-space: normal; }
  .mappanel td.restr { font-size: 13px; }
  .mappanel .hint { color: var(--muted); font-size: 13px; line-height: 1.5; padding: 12px 4px; }
  .mappanel .pick { display: block; width: 100%; text-align: left; margin-bottom: 4px; font-size: 12px; }
  .mappanel .pick .tag { margin-left: 6px; }
  .fixlbl { font-family: var(--mono); font-size: 10px; line-height: 1.25; color: #0a0e14; background: var(--amber); border-radius: 3px; padding: 1px 4px; white-space: nowrap; box-shadow: 0 0 4px #000; }
  .fixlbl.partial { background: #b9c3cc; }
  .fixlbl.passed { opacity: 0.5; }
  .fixlbl.bdry { background: var(--cyan); }
  .cslbl { font-family: var(--mono); font-size: 10px; color: var(--text); white-space: nowrap; text-shadow: 0 0 3px #000, 0 0 3px #000; }
  .artcc-label { font-family: var(--mono); font-size: 11px; color: #5c6b78; letter-spacing: 0.1em; }
  .leaflet-tooltip.cstip { background: #0e1319; color: var(--text); border: 1px solid #2a3644; font-family: var(--mono); font-size: 11px; }
  @media (max-width: 900px) {
    .mapwrap { grid-template-columns: 1fr; grid-template-rows: 55vh auto; height: auto; }
    .mappanel { overflow: visible; }
  }
  @media (max-width: 640px) {
    input[type=text] { width: 100%; }
    td.hand, td.restr { white-space: normal; }
  }
</style>
</head>
<body>
<div id="vatflowAppNav"></div>
<main>
  <h1>ZDC CROSSINGS</h1>
  <p class="sub" id="sub">ZDC SOP sector restrictions for each aircraft's filed route, from the live VATSIM feed.</p>

  <div id="gate" class="gate" hidden>
    <p id="gateMsg">Sign in with VATSIM to use this page.</p>
    <button type="button" id="gateSignIn">Sign in with VATSIM</button>
  </div>

  <div id="app" hidden>
    <div class="bar">
      <div class="seg" id="viewSeg">
        <button type="button" data-view="live" class="on">Live traffic</button>
        <button type="button" data-view="map">Map</button>
        <button type="button" data-view="ref">SOP tables</button>
      </div>
      <select id="cfgSel" title="Sector configuration"></select>
      <select id="secSel" title="Show restrictions you give or receive"></select>
      <input type="text" id="q" placeholder="Callsign, airport, fix…" autocomplete="off" spellcheck="false">
      <span class="status" id="status">Loading…</span>
    </div>
    <div class="bar" id="liveOpts">
      <label class="chk"><input type="checkbox" id="optZdc" checked> Only in or through ZDC</label>
      <label class="chk"><input type="checkbox" id="optPartial" checked> Include partial route matches</label>
      <label class="chk"><input type="checkbox" id="optPassed"> Show restrictions already passed</label>
      <label class="chk"><input type="checkbox" id="optPrefile"> Include prefiles</label>
    </div>
    <div id="out"></div>
    <div id="mapWrap" class="mapwrap" hidden>
      <div id="map"></div>
      <aside id="mapPanel" class="mappanel"></aside>
    </div>
    <p class="foot" id="foot"></p>
  </div>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@maplibre/maplibre-gl-leaflet@0.1.4/leaflet-maplibre-gl.js"></script>
<script src="shared/vatflow-basemap.js"></script>
<script type="module">
import { mountVatflowNav } from "./shared/vatflow-nav.js";
import { initVatflowAuth, canEditArtcc, isSignedIn, login } from "./shared/vatflow-auth.js";
import { getAirport, hasAirport, loadAirports } from "./shared/fca-metering.js";
import { fetchArtccBoundaries, pointInArtcc, getArtccRings, getArtccBounds } from "./shared/artcc-scope.js";
import { gcLine } from "./shared/fca-metering.js";
import { bindAirports, loadNavData, isNavReady, buildRouteAnchors, buildRouteAnchorsForAircraft, resolveToken } from "./shared/route-engine.js";
import { isUserTyping, VATSIM_FEED_MS } from "./shared/vatflow-refresh.js";
import { ROWS, SECTORS, SECTOR_REF, CONFIGS, FACILITY_NAMES, SOP_ID, SOP_DATE } from "./shared/zdc-sop-data.js";
import {
  matchFlight, descendViaFor, primaryAirports, satellitePrimaries, rowVisibleInConfig, ownerOf, engineClass,
} from "./shared/zdc-sop-match.js";

const VATSIM_URL = "https://data.vatsim.net/v3/vatsim-data.json";
const PREFS_KEY = "vatflow.zdcCrossings.prefs";

mountVatflowNav(document.getElementById("vatflowAppNav"), "zdc-crossings");

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const prefs = loadPrefs();
let view = ["ref", "map"].includes(prefs.view) ? prefs.view : "live";
let feed = null, feedAt = 0, feedErr = "";
let started = false, timer = null;

const ll = id => getAirport(id);
const geoCtx = { ll, primaries: primaryAirports(), satPrimaries: satellitePrimaries() };

function loadPrefs() {
  try { return JSON.parse(localStorage.getItem(PREFS_KEY) || "{}") || {}; } catch (_) { return {}; }
}
function savePrefs() {
  const p = {
    view, cfg: $("cfgSel").value, sec: $("secSel").value,
    zdc: $("optZdc").checked, partial: $("optPartial").checked, passed: $("optPassed").checked, prefile: $("optPrefile").checked,
  };
  try { localStorage.setItem(PREFS_KEY, JSON.stringify(p)); } catch (_) {}
}

/* ---------------- access gate ---------------- */

function gate() {
  const ok = canEditArtcc("ZDC");
  $("gate").hidden = ok;
  $("app").hidden = !ok;
  if (!ok) {
    $("gateMsg").textContent = isSignedIn()
      ? "This page is limited to VATFLOW users with ZDC access. Ask a VATFLOW admin to add ZDC to your whitelist entry."
      : "Sign in with VATSIM to use this page. It is limited to VATFLOW users with ZDC access.";
    $("gateSignIn").hidden = isSignedIn();
    return;
  }
  if (!started) start();
}
$("gateSignIn").addEventListener("click", () => login());
window.addEventListener("vatflow-auth-changed", gate);
initVatflowAuth().then(gate, gate);

/* ---------------- setup ---------------- */

function start() {
  started = true;
  $("cfgSel").innerHTML = Object.entries(CONFIGS).map(([k, c]) => `<option value="${k}">${esc(c.label)}</option>`).join("");
  $("secSel").innerHTML = `<option value="">All sectors</option>` +
    Object.entries(SECTORS).map(([k, n]) => `<option value="${k}">${k} ${esc(n)}</option>`).join("");
  if (prefs.cfg && CONFIGS[prefs.cfg]) $("cfgSel").value = prefs.cfg;
  refreshSectorOptions();
  if (prefs.sec) $("secSel").value = prefs.sec;
  if (prefs.zdc === false) $("optZdc").checked = false;
  if (prefs.partial === false) $("optPartial").checked = false;
  if (prefs.passed) $("optPassed").checked = true;
  if (prefs.prefile) $("optPrefile").checked = true;
  setView(view);

  $("viewSeg").addEventListener("click", e => {
    const b = e.target.closest("button[data-view]");
    if (b) { setView(b.dataset.view); savePrefs(); }
  });
  $("cfgSel").addEventListener("change", () => { refreshSectorOptions(); savePrefs(); render(); });
  ["secSel", "optZdc", "optPartial", "optPassed", "optPrefile"].forEach(id => $(id).addEventListener("change", () => { savePrefs(); render(); }));
  $("q").addEventListener("input", () => render());
  $("mapPanel").addEventListener("click", e => {
    const b = e.target.closest("button[data-cs], button[data-back]");
    if (!b) return;
    selected = b.dataset.cs || "";
    render();
  });

  $("foot").innerHTML =
    `Source: ${esc(SOP_ID)} (${esc(SOP_DATE)}), Chapter 4 sector procedures (given) and Chapter 5 descend-via bottom altitudes. ` +
    `"+" and SATS destinations are matched to fields within 35 nm of the named airport. ` +
    `A "?" marks a partial route match (the STAR or most of the routing matched, not every fix). ` +
    `Deconsolidated plans hide hand-offs between sectors the same controller owns. Reference only; the SOP governs.`;

  Promise.all([
    loadAirports().catch(() => null),
    fetchArtccBoundaries().catch(() => null),
    loadNavData().catch(() => null),
  ]).then(() => { bindAirports(getAirport, hasAirport); routeCache.clear(); drawBoundaries(); render(); });
  bindAirports(getAirport, hasAirport);
  poll();
  timer = setInterval(poll, VATSIM_FEED_MS);
}

function setView(v) {
  view = v;
  $("viewSeg").querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.view === v));
  $("liveOpts").hidden = v === "ref";
  $("out").hidden = v === "map";
  $("mapWrap").hidden = v !== "map";
  if (v === "map") ensureMap();
  render();
}

function refreshSectorOptions() {
  const cfg = CONFIGS[$("cfgSel").value];
  const cur = $("secSel").value;
  const list = cfg && cfg.groups
    ? Object.entries(cfg.groups).map(([k, secs]) => [k, `${k} ${SECTORS[k]} (${secs.join("/")})`])
    : Object.entries(SECTORS).map(([k, n]) => [k, `${k} ${n}`]);
  $("secSel").innerHTML = `<option value="">All sectors</option>` + list.map(([k, l]) => `<option value="${k}">${esc(l)}</option>`).join("");
  if (list.some(([k]) => k === cur)) $("secSel").value = cur;
}

/* ---------------- feed ---------------- */

async function poll() {
  try {
    const r = await fetch(VATSIM_URL, { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    feed = await r.json();
    feedAt = Date.now();
    feedErr = "";
  } catch (e) {
    feedErr = "VATSIM feed unavailable (" + (e.message || e) + ")";
  }
  if (!isUserTyping()) render();
}

/* ---------------- live view ---------------- */

const routeCache = new Map();
function routeInfo(f) {
  if (!isNavReady()) return null;
  const key = `${f.callsign}|${f.dep}|${f.arr}|${f.route}`;
  let base = routeCache.get(key);
  if (!base) {
    try { base = buildRouteAnchors({ dep: f.dep, arr: f.arr, route: f.route }); } catch (_) { base = { anchors: [] }; }
    routeCache.set(key, base);
  }
  let ahead = base.anchors;
  if (f.lat != null && !f.prefile && f.gs > 50) {
    try { ahead = buildRouteAnchorsForAircraft({ dep: f.dep, arr: f.arr, route: f.route, lat: f.lat, lon: f.lon, hdg: f.hdg }).anchors; } catch (_) {}
  }
  return { all: base.anchors, ahead };
}

function flightsFromFeed() {
  if (!feed) return [];
  const out = [];
  const add = (p, prefile) => {
    const fp = p.flight_plan;
    if (!fp || !fp.arrival || !fp.route) return;
    out.push({
      callsign: p.callsign, dep: (fp.departure || "").toUpperCase(), arr: (fp.arrival || "").toUpperCase(),
      route: fp.route, type: fp.aircraft_short || fp.aircraft_faa || fp.aircraft || "", altitude: fp.altitude,
      lat: prefile ? null : p.latitude, lon: prefile ? null : p.longitude, alt: prefile ? null : p.altitude,
      gs: prefile ? 0 : p.groundspeed, hdg: prefile ? null : p.heading, prefile,
    });
  };
  (feed.pilots || []).forEach(p => add(p, false));
  if ($("optPrefile").checked) (feed.prefiles || []).forEach(p => add(p, true));
  return out;
}

function inZdc(llPair) { return llPair && pointInArtcc("ZDC", llPair[0], llPair[1]) === true; }

function flightStatus(f, ri) {
  if (f.prefile) return { key: "pre", label: "PREFILE" };
  const here = f.lat != null && inZdc([f.lat, f.lon]);
  if (f.gs < 50) return { key: "gnd", label: "ON GROUND", outside: !here };
  if (here) return { key: "in", label: "IN ZDC" };
  if (ri && ri.ahead.some(a => a.ll && inZdc(a.ll))) return { key: "inb", label: "INBOUND" };
  return { key: "out", label: "OUTSIDE", outside: true };
}

function sectorFilterPass(row, cfgKey, sec) {
  if (!sec) return true;
  return ownerOf(row[0], cfgKey) === sec || ownerOf(row[5], cfgKey) === sec;
}

function computeCards(qStr) {
  const cfgKey = $("cfgSel").value;
  const sec = $("secSel").value;
  const onlyZdc = $("optZdc").checked, partialOk = $("optPartial").checked, showPassed = $("optPassed").checked;
  const flights = flightsFromFeed();
  const cards = [];

  for (const f of flights) {
    // Cheap first pass on the filed route alone; expand the route only for candidates.
    const first = matchFlight(f, { ...geoCtx, config: cfgKey });
    if (!first.length) continue;
    const ri = routeInfo(f);
    const matches = ri ? matchFlight(f, { ...geoCtx, config: cfgKey, extraFixes: ri.all.map(a => a.name) }) : first;
    const st = flightStatus(f, ri);
    if (onlyZdc && st.outside) {
      const depIn = inZdc(ll(f.dep)) || inZdc(ll(f.arr));
      if (!(f.gs < 50 && depIn) && !(f.prefile && depIn)) continue;
    }
    const aheadNames = ri ? new Set(ri.ahead.map(a => a.name)) : null;
    const allNames = ri ? new Set(ri.all.map(a => a.name)) : null;
    const rows = matches.filter(m => {
      if (!partialOk && m.quality !== "full") return false;
      if (!sectorFilterPass(m.row, cfgKey, sec)) return false;
      m.passed = !!(m.fix && aheadNames && allNames.has(m.fix) && !aheadNames.has(m.fix) && !f.prefile && f.gs >= 50);
      if (m.passed && !showPassed) return false;
      return true;
    });
    if (!rows.length) continue;
    const dv = descendViaFor(f);
    const hay = [f.callsign, f.dep, f.arr, f.route, f.type, ...rows.map(m => m.row.join(" "))].join(" ").toUpperCase();
    if (qStr && !qStr.split(/\s+/).every(w => hay.includes(w))) continue;
    cards.push({ f, st, rows, dv, ri });
  }

  const rank = { in: 0, inb: 1, gnd: 2, pre: 3, out: 4 };
  cards.sort((a, b) => (rank[a.st.key] - rank[b.st.key]) || a.f.callsign.localeCompare(b.f.callsign));
  return cards;
}

function setFeedStatus(cards) {
  const age = feedAt ? Math.round((Date.now() - feedAt) / 1000) : null;
  $("status").textContent = feedErr || (feed ? `${cards.length} aircraft · feed ${age}s ago` : "Loading VATSIM feed…");
  $("status").classList.toggle("err", !!feedErr);
}

function renderLive(qStr) {
  const sec = $("secSel").value;
  const cards = computeCards(qStr);
  setFeedStatus(cards);
  if (!feed) { $("out").innerHTML = `<p class="empty">Loading the VATSIM feed…</p>`; return; }
  if (!cards.length) {
    $("out").innerHTML = `<p class="empty">No aircraft on routes with ZDC SOP restrictions${qStr || sec ? " match these filters" : " right now"}.</p>`;
    return;
  }
  $("out").innerHTML = cards.map(renderCard).join("");
}

function sectorCell(id, cfgKey) {
  const s = /^\d$/.test(id) ? "0" + id : id;
  if (SECTORS[s]) {
    const owner = ownerOf(s, cfgKey);
    const ownerTxt = owner && owner !== s ? ` @ ${owner}` : "";
    return `${esc(s)}${esc(ownerTxt)} <span class="secname">${esc(SECTORS[s])}</span>`;
  }
  const name = FACILITY_NAMES[s] || (/z$/.test(s) ? `${s.slice(0, -1)} TRACON/ATCT` : "");
  return `${esc(s)}${name ? ` <span class="secname">${esc(name)}</span>` : ""}`;
}

function renderCard({ f, st, rows, dv }) {
  const cfgKey = $("cfgSel").value;
  const cls = engineClass(f.type);
  const cruise = f.altitude ? String(f.altitude) : "";
  const now = f.alt != null ? `${Math.round(f.alt / 100).toString().padStart(3, "0")} · ${f.gs}kt` : "";
  const fixSet = new Set(rows.map(m => m.fix).filter(Boolean));
  rows.forEach(m => m.row[3].replace(/[\[\]()]/g, " ").split(/[\s/]+/).forEach(t => t && fixSet.add(t.replace("#", ""))));
  const routeHtml = String(f.route).split(/\s+/).map(tok => {
    const base = tok.split(/[./]/)[0].toUpperCase().replace(/\d[A-Z]?$/, "");
    const hit = fixSet.has(tok.toUpperCase()) || (base.length >= 3 && fixSet.has(base));
    return hit ? `<mark>${esc(tok)}</mark>` : esc(tok);
  }).join(" ");

  const body = rows.map(m => {
    const r = m.row;
    const notes = [...m.notes];
    if (m.how === "satellite") notes.push(`${f.arr} as satellite of ${r[1]}`);
    if (r[2]) notes.push(r[2]);
    if (m.typeUnknown) notes.push(`aircraft type ${f.type || "?"} not classified`);
    if (m.passed) notes.push("passed");
    return `<tr class="${m.quality}${m.passed ? " passed" : ""}">` +
      `<td class="hand">${sectorCell(r[0], cfgKey)} <span class="arrow">→</span> ${sectorCell(r[5], cfgKey)}</td>` +
      `<td class="restr">${esc(r[4])}</td>` +
      `<td>${esc(r[1])} ${esc(r[3])}${notes.length ? `<div class="note">${esc(notes.join(" · "))}</div>` : ""}</td>` +
      `<td><span class="q ${m.quality}">${m.quality === "full" ? "ROUTE" : "PARTIAL"}</span> <span class="secname">${esc(SECTOR_REF[r[0]] || "")}</span></td>` +
      `</tr>`;
  }).join("");

  const dvHtml = dv.length ? dv.map(d =>
    `<div class="dv">${esc(d.star)}#${d.via ? ` (${esc(d.via)})` : ""} descend via · bottom ${esc(d.alt)} (QQ P) · join by ${esc(d.join)}${d.handoff ? ` · handoff ${esc(d.handoff)}` : ""}</div>`).join("") : "";

  return `<div class="ac">` +
    `<div class="ac-head"><span class="cs">${esc(f.callsign)}</span>` +
    `<span class="meta"><b>${esc(f.dep)}</b> → <b>${esc(f.arr)}</b></span>` +
    `<span class="meta">${esc(f.type)}${cls ? ` · ${cls}` : ""}</span>` +
    `<span class="meta">filed ${esc(cruise)}${now ? ` · now ${esc(now)}` : ""}</span>` +
    `<span class="tag ${st.key}">${esc(st.label)}</span></div>` +
    `<div class="route">${routeHtml}</div>` +
    `<table><thead><tr><th>Sector → to</th><th>Restriction</th><th>For / routing</th><th>Match</th></tr></thead><tbody>${body}</tbody></table>` +
    dvHtml + `</div>`;
}

/* ---------------- reference view ---------------- */

function renderRef(qStr) {
  const cfgKey = $("cfgSel").value;
  const sec = $("secSel").value;
  const rows = ROWS.filter(r => rowVisibleInConfig(r, cfgKey) && sectorFilterPass(r, cfgKey, sec))
    .filter(r => !qStr || qStr.split(/\s+/).every(w => r.join(" ").toUpperCase().includes(w)));
  $("status").textContent = `${rows.length} of ${ROWS.length} restrictions`;
  $("status").classList.remove("err");
  if (!rows.length) { $("out").innerHTML = `<p class="empty">No SOP restrictions match these filters.</p>`; return; }
  $("out").innerHTML = `<div class="ref"><table><thead><tr><th>Sector → to</th><th>Restriction</th><th>For</th><th>Routing</th><th>Ref</th></tr></thead><tbody>` +
    rows.map(r => `<tr><td class="hand">${sectorCell(r[0], cfgKey)} <span class="arrow">→</span> ${sectorCell(r[5], cfgKey)}</td>` +
      `<td class="restr">${esc(r[4])}</td>` +
      `<td>${esc(r[1])}${r[2] ? ` <span class="note">${esc(r[2])}</span>` : ""}</td><td>${esc(r[3])}</td>` +
      `<td class="secname">${esc(SECTOR_REF[r[0]] || "")}</td></tr>`).join("") +
    `</tbody></table></div>`;
}

/* ---------------- map view ---------------- */

const NEIGHBOR_ARTCCS = ["ZNY", "ZOB", "ZID", "ZTL", "ZJX", "ZBW"];
const STATUS_COLOR = { in: "#57d98a", inb: "#3fb7b0", gnd: "#8a97a3", pre: "#5c6b78", out: "#5c6b78" };
let map = null, mapLayers = null, selected = "", fittedZdc = false, fittedSel = "";

function ensureMap() {
  if (map) { setTimeout(() => map.invalidateSize(), 0); return; }
  if (typeof L === "undefined") return;
  map = L.map("map", { zoomControl: false, minZoom: 4, maxZoom: 11 });
  L.control.zoom({ position: "bottomright" }).addTo(map);
  if (window.addVatflowBasemap) window.addVatflowBasemap(map);
  mapLayers = {
    bdry: L.layerGroup().addTo(map), route: L.layerGroup().addTo(map),
    fixes: L.layerGroup().addTo(map), traffic: L.layerGroup().addTo(map),
  };
  map.setView([38.3, -77.8], 6);
  map.on("click", () => { if (selected) { selected = ""; render(); } });
  drawBoundaries();
}

function drawBoundaries() {
  if (!map) return;
  mapLayers.bdry.clearLayers();
  for (const id of ["ZDC", ...NEIGHBOR_ARTCCS]) {
    const rings = getArtccRings(id);
    if (!rings) continue;
    const zdc = id === "ZDC";
    rings.forEach(r => L.polygon(r, {
      color: zdc ? "#e8a838" : "#3a4d5e", weight: zdc ? 1.5 : 1, opacity: zdc ? 0.6 : 0.8,
      fill: zdc, fillOpacity: 0.03, interactive: false,
    }).addTo(mapLayers.bdry));
    const b = getArtccBounds(id);
    if (b) {
      L.marker(L.latLngBounds(b).getCenter(), {
        interactive: false, icon: L.divIcon({ className: "artcc-label", html: id, iconSize: [34, 12] }),
      }).addTo(mapLayers.bdry);
    }
  }
  const zb = getArtccBounds("ZDC");
  if (zb && !fittedZdc) { map.fitBounds(zb, { padding: [10, 10] }); fittedZdc = true; }
}

function planeIcon(color, hdg, big) {
  const sz = big ? 18 : 12;
  return L.divIcon({
    className: "",
    iconSize: [sz, sz], iconAnchor: [sz / 2, sz / 2],
    html: `<div style="transform:rotate(${Number(hdg) || 0}deg);width:${sz}px;height:${sz}px">` +
      `<svg viewBox="0 0 24 24" width="${sz}" height="${sz}"><path d="M12 2 L19 21 L12 16.5 L5 21 Z" fill="${color}" stroke="#0a0e14" stroke-width="1.2"/></svg></div>`,
  });
}

/** Great-circle polyline through a list of [lat, lon]. */
function gcPath(lls) {
  let out = [];
  for (let i = 0; i < lls.length - 1; i++) {
    const seg = gcLine(lls[i], lls[i + 1]);
    if (i > 0) seg.shift();
    out = out.concat(seg);
  }
  return out;
}

/** Last point where a path leaves ZDC (for "BDRY" hand-offs to another ARTCC). */
function zdcExitPoint(path) {
  let exit = null;
  for (let i = 1; i < path.length; i++) {
    if (inZdc(path[i - 1]) && !inZdc(path[i])) exit = path[i - 1];
  }
  return exit;
}

function fixLatLon(name, card) {
  const a = card.ri && card.ri.all.find(x => x.name === name && x.ll);
  if (a) return a.ll;
  const ref = card.f.lat != null ? [card.f.lat, card.f.lon] : ll(card.f.arr);
  try { const r = resolveToken(name, { refLL: ref, dep: card.f.dep, arr: card.f.arr }); return r ? r.ll : null; } catch (_) { return null; }
}

function drawSelected(card) {
  const { f, ri, rows } = card;
  const pos = f.lat != null && !f.prefile ? [f.lat, f.lon] : null;
  const allLL = ri ? ri.all.filter(a => a.ll).map(a => a.ll) : [ll(f.dep), pos, ll(f.arr)].filter(Boolean);
  const aheadLL = ri ? ri.ahead.filter(a => a.ll).map(a => a.ll) : [pos, ll(f.arr)].filter(Boolean);
  const full = gcPath(allLL), ahead = gcPath(aheadLL);
  if (full.length > 1) L.polyline(full, { color: "#8a97a3", weight: 1.5, opacity: 0.5, dashArray: "3 5", interactive: false }).addTo(mapLayers.route);
  if (ahead.length > 1) L.polyline(ahead, { color: "#e8a838", weight: 2.5, opacity: 0.85, interactive: false }).addTo(mapLayers.route);

  // One label per crossing point, listing every restriction at it.
  const cfgKey = $("cfgSel").value;
  const groups = new Map();
  const add = (key, llPair, kind, m) => {
    if (!llPair) return;
    if (!groups.has(key)) groups.set(key, { ll: llPair, kind, items: [] });
    groups.get(key).items.push(m);
  };
  let exit;
  // Descend-via rows sit at the STAR's join-by fix (Ch 5 Sec 2) when it is known.
  const dvJoin = card.dv && card.dv[0] ? card.dv[0].join : null;
  for (const m of rows) {
    if (m.fix) add(m.fix, fixLatLon(m.fix, card), "fix", m);
    else if (/^D\/V/.test(m.row[4]) && dvJoin) add(dvJoin, fixLatLon(dvJoin, card), "fix", m);
    else if (/^(Z[A-Z]{2}|N90)$/.test(m.row[5]) && /^(BDRY|AOB|AT|DSDG|FL)/.test(m.row[4])) {
      if (exit === undefined) exit = zdcExitPoint(full.length ? full : allLL);
      add("BDRY", exit, "bdry", m);
    }
  }
  for (const [key, g] of groups) {
    const allPassed = g.items.every(m => m.passed);
    const anyFull = g.items.some(m => m.quality === "full");
    const lines = g.items.map(m => `${esc(m.row[4])} <span style="opacity:.7">${esc(ownerOf(m.row[0], cfgKey) || m.row[0])}→${esc(ownerOf(m.row[5], cfgKey) || m.row[5])}</span>`);
    const head = key === "BDRY" ? "ZDC BDRY" : esc(key);
    L.circleMarker(g.ll, { radius: 4, color: "#0a0e14", weight: 1, fillColor: g.kind === "bdry" ? "#3fb7b0" : "#e8a838", fillOpacity: 1 }).addTo(mapLayers.fixes);
    L.marker(g.ll, {
      interactive: false,
      icon: L.divIcon({
        className: "",
        iconSize: null,
        iconAnchor: [-8, 10],
        html: `<div class="fixlbl${g.kind === "bdry" ? " bdry" : ""}${anyFull ? "" : " partial"}${allPassed ? " passed" : ""}"><b>${head}</b><br>${lines.join("<br>")}</div>`,
      }),
    }).addTo(mapLayers.fixes);
  }

  if (fittedSel !== f.callsign) {
    fittedSel = f.callsign;
    // Frame the ZDC part of the trip: crossing points, route inside ZDC, and the
    // aircraft when it is close; a cross-country route otherwise zooms out to the coast.
    const zb = getArtccBounds("ZDC");
    const near = p => zb && L.latLngBounds(zb).pad(0.6).contains(p);
    const pts = [...[...groups.values()].map(g => g.ll), ...(ahead.length ? ahead : full).filter(p => inZdc(p))];
    if (pos && near(pos)) pts.push(pos);
    if (pts.length > 1) map.fitBounds(L.latLngBounds(pts), { padding: [40, 40], maxZoom: 8 });
    else if (zb) map.fitBounds(zb, { padding: [10, 10] });
  }
}

function renderMap(qStr) {
  ensureMap();
  const cards = computeCards(qStr);
  setFeedStatus(cards);
  const panel = $("mapPanel");
  if (!map) { panel.innerHTML = `<p class="hint">The map library did not load. Try reloading the page.</p>`; return; }
  mapLayers.traffic.clearLayers();
  mapLayers.route.clearLayers();
  mapLayers.fixes.clearLayers();
  const sel = cards.find(c => c.f.callsign === selected) || null;
  if (!sel) fittedSel = "";

  for (const c of cards) {
    if (c.f.lat == null || c.f.prefile) continue;
    const isSel = c === sel;
    const color = isSel ? "#e8a838" : STATUS_COLOR[c.st.key] || "#8a97a3";
    L.marker([c.f.lat, c.f.lon], { icon: planeIcon(color, c.f.hdg, isSel), zIndexOffset: isSel ? 1000 : 0, keyboard: false })
      .bindTooltip(`<b>${esc(c.f.callsign)}</b> ${esc(c.f.dep)}→${esc(c.f.arr)} · ${c.rows.length} restriction${c.rows.length === 1 ? "" : "s"}`,
        { className: "cstip", direction: "top", offset: [0, -8] })
      .on("click", e => { L.DomEvent.stopPropagation(e); selected = c.f.callsign; render(); })
      .addTo(mapLayers.traffic);
  }
  if (sel) drawSelected(sel);

  if (!feed) { panel.innerHTML = `<p class="hint">Loading the VATSIM feed…</p>`; return; }
  if (sel) {
    panel.innerHTML = `<button type="button" class="pick" data-back="1">← All aircraft</button>` + renderCard(sel);
    return;
  }
  panel.innerHTML = cards.length
    ? `<p class="hint">Click an aircraft on the map, or pick one here, to see its restrictions and crossing points.</p>` +
      cards.map(c => `<button type="button" class="pick" data-cs="${esc(c.f.callsign)}">${esc(c.f.callsign)} ` +
        `<span class="meta">${esc(c.f.dep)}→${esc(c.f.arr)} · ${c.rows.length}</span><span class="tag ${c.st.key}">${esc(c.st.label)}</span></button>`).join("")
    : `<p class="hint">No aircraft on routes with ZDC SOP restrictions match these filters.</p>`;
}

function render() {
  if (!started) return;
  const qStr = $("q").value.trim().toUpperCase();
  if (view === "ref") renderRef(qStr);
  else if (view === "map") renderMap(qStr);
  else renderLive(qStr);
}
</script>
</body>
</html>

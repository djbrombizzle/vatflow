<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>ZDC Crossings — VATFLOW</title>
<link rel="stylesheet" href="shared/vatflow-nav.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
  :root {
    --bg: #080b10;
    --panel: #0e1319;
    --panel2: #121922;
    --text: #d4dde6;
    --muted: #8a97a3;
    --dim: #5c6b78;
    --amber: #e8a838;
    --cyan: #3fb7b0;
    --green: #57d98a;
    --red: #e07070;
    --line: #1e2834;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    --ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --vatflow-nav-h: 28px;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); font-family: var(--ui); }
  #vatflowAppNav { position: fixed; top: 0; left: 0; right: 0; z-index: 700; }
  main { max-width: 1100px; margin: 0 auto; padding: calc(var(--vatflow-nav-h) + 20px) 16px 40px; }
  h1 { font-family: var(--mono); font-size: 18px; letter-spacing: 0.14em; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 12px; line-height: 1.5; margin: 0 0 16px; }
  .sub b { color: var(--text); font-weight: 600; }

  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
  select, input[type=text], button {
    font-family: var(--mono); font-size: 13px; color: var(--text); background: var(--panel);
    border: 1px solid #2a3644; border-radius: 6px; padding: 7px 10px;
  }
  input[type=text] { width: 220px; text-transform: uppercase; }
  button { cursor: pointer; }
  button:hover, select:hover { border-color: var(--amber); }
  button.on { border-color: var(--amber); color: var(--amber); }
  label.chk { font-family: var(--mono); font-size: 12px; color: var(--muted); display: inline-flex; gap: 5px; align-items: center; cursor: pointer; }
  .seg { display: inline-flex; }
  .seg button { border-radius: 0; }
  .seg button:first-child { border-radius: 6px 0 0 6px; }
  .seg button:last-child { border-radius: 0 6px 6px 0; }
  .status { font-family: var(--mono); font-size: 11px; color: var(--dim); margin-left: auto; }
  .status.err { color: var(--red); }

  .gate { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 24px; max-width: 520px; }
  .gate p { color: var(--muted); font-size: 13px; line-height: 1.5; }

  .ac { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; margin-bottom: 10px; overflow: hidden; }
  .ac-head { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: baseline; padding: 10px 14px; background: var(--panel2); border-bottom: 1px solid var(--line); }
  .cs { font-family: var(--mono); font-size: 16px; font-weight: 700; letter-spacing: 0.06em; }
  .meta { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .meta b { color: var(--text); font-weight: 600; }
  .tag { font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em; padding: 1px 6px; border-radius: 3px; border: 1px solid currentColor; }
  .tag.in { color: var(--green); }
  .tag.inb { color: var(--cyan); }
  .tag.gnd { color: var(--muted); }
  .tag.pre { color: var(--dim); }
  .route { font-family: var(--mono); font-size: 11px; color: var(--dim); padding: 6px 14px 0; overflow-wrap: anywhere; }
  .route mark { background: none; color: var(--amber); }

  table { width: 100%; border-collapse: collapse; font-family: var(--mono); font-size: 12px; }
  th { text-align: left; font-weight: 500; color: var(--dim); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; padding: 6px 10px; border-bottom: 1px solid var(--line); }
  td { padding: 6px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  tr:last-child td { border-bottom: none; }
  .ac table { margin-top: 6px; }
  td.restr { color: var(--amber); font-weight: 600; white-space: nowrap; }
  td.hand { white-space: nowrap; }
  td.hand .arrow { color: var(--dim); }
  .secname { color: var(--dim); font-size: 10px; }
  td.secname { white-space: nowrap; }
  tr.passed td { opacity: 0.45; }
  tr.partial td.restr::after { content: " ?"; color: var(--dim); }
  .note { color: var(--muted); font-size: 11px; }
  .q { font-size: 10px; letter-spacing: 0.06em; }
  .q.full { color: var(--green); }
  .q.partial { color: var(--muted); }
  .dv { padding: 8px 14px; font-family: var(--mono); font-size: 12px; color: var(--cyan); border-top: 1px solid var(--line); }
  .empty { color: var(--muted); font-size: 13px; padding: 24px 0; }
  .sidh { font-family: var(--mono); font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 18px 0 8px; font-weight: 500; }
  h3.sidh { font-size: 12px; margin-top: 14px; }
  b.sidalt { color: var(--amber); }
  .inbh { font-family: var(--mono); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--cyan, #3fb7b0); padding: 10px 10px 0; }
  .tag.off { color: var(--amber); }
  table.inb td.restr { color: #3fb7b0; }
  .ref { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow-x: auto; }
  .foot { color: var(--dim); font-size: 11px; line-height: 1.6; margin-top: 18px; }

  body.wide main { max-width: none; }
  .mapwrap { position: relative; height: calc(100vh - var(--vatflow-nav-h) - 170px); min-height: 420px; }
  #map { height: 100%; border: 1px solid var(--line); border-radius: 8px; background: #0a0e14; }
  #map .leaflet-container, #map.leaflet-container { background: #0a0e14; font-family: var(--mono); }
  .mappanel { position: absolute; top: 10px; right: 10px; z-index: 800; width: 400px; max-height: calc(100% - 20px); overflow-y: auto;
    background: rgba(13, 17, 23, 0.94); border: 1px solid var(--line); border-radius: 8px; padding: 8px; box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5); }
  .mappanel:empty { display: none; }
  .mappanel .ac { margin-bottom: 0; }
  .mappanel thead { display: none; }
  .mappanel tr { display: block; padding: 6px 0; border-bottom: 1px solid var(--line); }
  .mappanel tr:last-child { border-bottom: none; }
  .mappanel td { display: block; border: none; padding: 1px 12px; white-space: normal; }
  .mappanel td.restr { font-size: 13px; }
  .mappanel .hint { color: var(--muted); font-size: 13px; line-height: 1.5; padding: 12px 4px; }
  .mappanel .pick { display: block; width: 100%; text-align: left; margin-bottom: 4px; font-size: 12px; }
  .mappanel .pick .tag { margin-left: 6px; }
  .fixlbl { font-family: var(--mono); font-size: 10px; line-height: 1.25; color: #0a0e14; background: var(--amber); border-radius: 3px; padding: 1px 4px; white-space: nowrap; box-shadow: 0 0 4px #000; }
  .fixlbl.partial { background: #b9c3cc; }
  .fixlbl.passed { opacity: 0.5; }
  .fixlbl.bdry { background: var(--cyan); }
  .cslbl { font-family: var(--mono); font-size: 10px; color: var(--text); white-space: nowrap; text-shadow: 0 0 3px #000, 0 0 3px #000; }
  #strataSeg button { font-size: 11px; padding: 4px 8px; }
  .seclbl { font-family: var(--mono); font-size: 10px; color: #8a97a3; white-space: nowrap; text-align: center; text-shadow: 0 0 3px #000, 0 0 3px #000; }
  .seclbl b { color: #c3ccd5; font-size: 11px; }
  .seclbl.give { color: var(--amber); }
  .seclbl.give b { color: var(--amber); }
  .seclbl.recv, .seclbl.recv b { color: var(--cyan); }
  .arealbl { font-family: var(--mono); font-size: 10px; line-height: 1.2; color: #8a97a3; white-space: nowrap; text-align: center; text-shadow: 0 0 3px #000, 0 0 3px #000; transform: translate(-50%, -50%); }
  .arealbl .give { color: var(--amber); }
  .arealbl .recv { color: var(--cyan); }
  .legend { font-family: var(--mono); font-size: 11px; color: var(--muted); padding: 8px 4px 0; line-height: 1.5; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; vertical-align: -1px; margin-right: 4px; }
  .artcc-label { font-family: var(--mono); font-size: 11px; color: #5c6b78; letter-spacing: 0.1em; }
  .leaflet-tooltip.cstip { background: #0e1319; color: var(--text); border: 1px solid #2a3644; font-family: var(--mono); font-size: 11px; }
  @media (max-width: 900px) {
    .mapwrap { height: auto; }
    #map { height: 60vh; }
    .mappanel { position: static; width: auto; max-height: none; overflow: visible; margin-top: 10px; box-shadow: none; }
  }
  @media (max-width: 640px) {
    input[type=text] { width: 100%; }
    td.hand, td.restr { white-space: normal; }
  }
</style>
</head>
<body>
<div id="vatflowAppNav"></div>
<main>
  <h1>ZDC CROSSINGS</h1>
  <p class="sub" id="sub">ZDC SOP sector restrictions for each aircraft's filed route, from the live VATSIM feed.</p>

  <div id="gate" class="gate" hidden>
    <p id="gateMsg">Sign in with VATSIM to use this page.</p>
    <button type="button" id="gateSignIn">Sign in with VATSIM</button>
  </div>

  <div id="app" hidden>
    <div class="bar">
      <div class="seg" id="viewSeg">
        <button type="button" data-view="live" class="on">Live traffic</button>
        <button type="button" data-view="map">Map</button>
        <button type="button" data-view="ref">SOP tables</button>
        <button type="button" data-view="sid">SIDs</button>
      </div>
      <select id="cfgSel" title="Sector configuration"></select>
      <select id="secSel" title="Show restrictions you give or receive"></select>
      <input type="text" id="q" placeholder="Callsign, airport, fix…" autocomplete="off" spellcheck="false">
      <span class="status" id="status">Loading…</span>
    </div>
    <div class="bar" id="liveOpts">
      <label class="chk"><input type="checkbox" id="optZdc" checked> Only in or through ZDC</label>
      <label class="chk"><input type="checkbox" id="optPartial" checked> Include partial route matches</label>
      <label class="chk"><input type="checkbox" id="optPassed"> Show restrictions already passed</label>
      <label class="chk"><input type="checkbox" id="optPrefile"> Include prefiles</label>
      <span class="seg" id="strataSeg" title="ZDC sector boundaries on the map">
        <button type="button" data-strata="off">No sectors</button>
        <button type="button" data-strata="on">Sectors</button>
      </span>
    </div>
    <div id="out"></div>
    <div id="mapWrap" class="mapwrap" hidden>
      <div id="map"></div>
      <aside id="mapPanel" class="mappanel"></aside>
    </div>
    <p class="foot" id="foot"></p>
  </div>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@maplibre/maplibre-gl-leaflet@0.1.4/leaflet-maplibre-gl.js"></script>
<script src="shared/vatflow-basemap.js"></script>
<script type="module">
import { mountVatflowNav } from "./shared/vatflow-nav.js";
import { initVatflowAuth, canEditArtcc, isSignedIn, login } from "./shared/vatflow-auth.js";
import { getAirport, hasAirport, loadAirports } from "./shared/fca-metering.js";
import { fetchArtccBoundaries, pointInArtcc, getArtccRings, getArtccBounds } from "./shared/artcc-scope.js";
import { gcLine } from "./shared/fca-metering.js";
import { bindAirports, loadNavData, isNavReady, buildRouteAnchors, buildRouteAnchorsForAircraft, resolveToken } from "./shared/route-engine.js";
import { isUserTyping, VATSIM_FEED_MS } from "./shared/vatflow-refresh.js";
import { REF_DOCS, REF_ITEMS } from "./shared/zdc-reference-data.js";
import { matchReference, artccId } from "./shared/zdc-reference-match.js";
import { SIDS, SID_AIRPORTS, SID_SOURCE, departureSid } from "./shared/zdc-sid-data.js";
import { ROWS, SECTORS, SECTOR_REF, CONFIGS, FACILITY_NAMES, SOP_ID, SOP_DATE } from "./shared/zdc-sop-data.js";
import {
  matchFlight, descendViaFor, primaryAirports, satellitePrimaries, rowVisibleInConfig, ownerOf, engineClass,
  onlineFacilities,
} from "./shared/zdc-sop-match.js";

const VATSIM_URL = "https://data.vatsim.net/v3/vatsim-data.json";
const PREFS_KEY = "vatflow.zdcCrossings.prefs";

mountVatflowNav(document.getElementById("vatflowAppNav"), "zdc-crossings");

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const prefs = loadPrefs();
let view = ["ref", "map", "sid"].includes(prefs.view) ? prefs.view : "live";
let feed = null, feedAt = 0, feedErr = "", onlineSet = new Set();
let started = false, timer = null;

const ll = id => getAirport(id);
const geoCtx = { ll, primaries: primaryAirports(), satPrimaries: satellitePrimaries() };

function loadPrefs() {
  try { return JSON.parse(localStorage.getItem(PREFS_KEY) || "{}") || {}; } catch (_) { return {}; }
}
function savePrefs() {
  const p = {
    view, cfg: $("cfgSel").value, sec: $("secSel").value,
    strata, zdc: $("optZdc").checked, partial: $("optPartial").checked, passed: $("optPassed").checked, prefile: $("optPrefile").checked,
  };
  try { localStorage.setItem(PREFS_KEY, JSON.stringify(p)); } catch (_) {}
}

/* ---------------- access gate ---------------- */

function gate() {
  const ok = canEditArtcc("ZDC");
  $("gate").hidden = ok;
  $("app").hidden = !ok;
  if (!ok) {
    $("gateMsg").textContent = isSignedIn()
      ? "This page is limited to VATFLOW users with ZDC access. Ask a VATFLOW admin to add ZDC to your whitelist entry."
      : "Sign in with VATSIM to use this page. It is limited to VATFLOW users with ZDC access.";
    $("gateSignIn").hidden = isSignedIn();
    return;
  }
  if (!started) start();
}
$("gateSignIn").addEventListener("click", () => login());
window.addEventListener("vatflow-auth-changed", gate);
initVatflowAuth().then(gate, gate);

/* ---------------- setup ---------------- */

function start() {
  started = true;
  loadSectors();
  $("cfgSel").innerHTML = Object.entries(CONFIGS).map(([k, c]) => `<option value="${k}">${esc(c.label)}</option>`).join("");
  $("secSel").innerHTML = `<option value="">All sectors</option>` +
    Object.entries(SECTORS).map(([k, n]) => `<option value="${k}">${k} ${esc(n)}</option>`).join("");
  if (prefs.cfg && CONFIGS[prefs.cfg]) $("cfgSel").value = prefs.cfg;
  refreshSectorOptions();
  if (prefs.sec) $("secSel").value = prefs.sec;
  if (prefs.zdc === false) $("optZdc").checked = false;
  if (prefs.partial === false) $("optPartial").checked = false;
  if (prefs.passed) $("optPassed").checked = true;
  if (prefs.prefile) $("optPrefile").checked = true;
  setView(view);

  $("strataSeg").addEventListener("click", e => {
    const b = e.target.closest("button[data-strata]");
    if (!b) return;
    strata = b.dataset.strata;
    savePrefs();
    render();
  });
  $("viewSeg").addEventListener("click", e => {
    const b = e.target.closest("button[data-view]");
    if (b) { setView(b.dataset.view); savePrefs(); }
  });
  $("cfgSel").addEventListener("change", () => { refreshSectorOptions(); savePrefs(); render(); });
  ["secSel", "optZdc", "optPartial", "optPassed", "optPrefile"].forEach(id => $(id).addEventListener("change", () => { savePrefs(); render(); }));
  $("q").addEventListener("input", () => render());
  $("mapPanel").addEventListener("click", e => {
    const b = e.target.closest("button[data-cs], button[data-back]");
    if (!b) return;
    selected = b.dataset.cs || "";
    render();
  });

  $("foot").innerHTML =
    `Source: ${esc(SOP_ID)} (${esc(SOP_DATE)}), Chapter 4 sector procedures (given) and Chapter 5 descend-via bottom altitudes. ` +
    `"+" and SATS destinations are matched to fields within 35 nm of the named airport. ` +
    `A "?" marks a partial route match (the STAR or most of the routing matched, not every fix). ` +
    `Deconsolidated plans hide hand-offs between sectors the same controller owns. Reference only; the SOP governs.`;

  Promise.all([
    loadAirports().catch(() => null),
    fetchArtccBoundaries().catch(() => null),
    loadNavData().catch(() => null),
  ]).then(() => { bindAirports(getAirport, hasAirport); routeCache.clear(); drawBoundaries(); render(); });
  bindAirports(getAirport, hasAirport);
  poll();
  timer = setInterval(poll, VATSIM_FEED_MS);
}

function setView(v) {
  view = v;
  $("viewSeg").querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.view === v));
  $("liveOpts").hidden = v === "ref" || v === "sid";
  $("secSel").hidden = v === "sid";
  $("strataSeg").hidden = v !== "map";
  $("out").hidden = v === "map";
  $("mapWrap").hidden = v !== "map";
  document.body.classList.toggle("wide", v === "map");
  if (v === "map") ensureMap();
  render();
}

function refreshSectorOptions() {
  const cfg = CONFIGS[$("cfgSel").value];
  const cur = $("secSel").value;
  const list = cfg && cfg.groups
    ? Object.entries(cfg.groups).map(([k, secs]) => [k, `${k} ${SECTORS[k]} (${secs.join("/")})`])
    : Object.entries(SECTORS).map(([k, n]) => [k, `${k} ${n}`]);
  $("secSel").innerHTML = `<option value="">All sectors</option>` + list.map(([k, l]) => `<option value="${k}">${esc(l)}</option>`).join("");
  if (list.some(([k]) => k === cur)) $("secSel").value = cur;
}

/* ---------------- feed ---------------- */

async function poll() {
  try {
    const r = await fetch(VATSIM_URL, { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    feed = await r.json();
    onlineSet = onlineFacilities(feed.controllers);
    geoCtx.facilityOpen = fac => onlineSet.has(fac);
    feedAt = Date.now();
    feedErr = "";
  } catch (e) {
    feedErr = "VATSIM feed unavailable (" + (e.message || e) + ")";
  }
  if (!isUserTyping()) render();
}

/* ---------------- live view ---------------- */

const routeCache = new Map();
function routeInfo(f) {
  if (!isNavReady()) return null;
  const key = `${f.callsign}|${f.dep}|${f.arr}|${f.route}`;
  let base = routeCache.get(key);
  if (!base) {
    try { base = buildRouteAnchors({ dep: f.dep, arr: f.arr, route: f.route }); } catch (_) { base = { anchors: [] }; }
    routeCache.set(key, base);
  }
  let ahead = base.anchors;
  if (f.lat != null && !f.prefile && f.gs > 50) {
    try { ahead = buildRouteAnchorsForAircraft({ dep: f.dep, arr: f.arr, route: f.route, lat: f.lat, lon: f.lon, hdg: f.hdg }).anchors; } catch (_) {}
  }
  return { all: base.anchors, ahead };
}

function flightsFromFeed() {
  if (!feed) return [];
  const out = [];
  const add = (p, prefile) => {
    const fp = p.flight_plan;
    if (!fp || !fp.arrival || !fp.route) return;
    out.push({
      callsign: p.callsign, dep: (fp.departure || "").toUpperCase(), arr: (fp.arrival || "").toUpperCase(),
      route: fp.route, type: fp.aircraft_short || fp.aircraft_faa || fp.aircraft || "", altitude: fp.altitude,
      lat: prefile ? null : p.latitude, lon: prefile ? null : p.longitude, alt: prefile ? null : p.altitude,
      gs: prefile ? 0 : p.groundspeed, hdg: prefile ? null : p.heading, prefile,
    });
  };
  (feed.pilots || []).forEach(p => add(p, false));
  if ($("optPrefile").checked) (feed.prefiles || []).forEach(p => add(p, true));
  return out;
}

function inZdc(llPair) { return llPair && pointInArtcc("ZDC", llPair[0], llPair[1]) === true; }

function flightStatus(f, ri) {
  if (f.prefile) return { key: "pre", label: "PREFILE" };
  const here = f.lat != null && inZdc([f.lat, f.lon]);
  if (f.gs < 50) return { key: "gnd", label: "ON GROUND", outside: !here };
  if (here) return { key: "in", label: "IN ZDC" };
  if (ri && ri.ahead.some(a => a.ll && inZdc(a.ll))) return { key: "inb", label: "INBOUND" };
  return { key: "out", label: "OUTSIDE", outside: true };
}

function sectorFilterPass(row, cfgKey, sec) {
  if (!sec) return true;
  return ownerOf(row[0], cfgKey) === sec || ownerOf(row[5], cfgKey) === sec;
}

/* LOA rules a neighbour applies before handing traffic to ZDC (ZNY → ZDC,
   ZID → ZDC, CLT → ZDC …): the altitude and crossing to expect on check-in,
   or to issue yourself when that neighbour is offline. */
const INBOUND_ITEMS = REF_ITEMS.filter(it => it.live && artccId(it.to) === "ZDC" && it.from && String(it.from).toUpperCase() !== "ZDC");
const REF_DOC = Object.fromEntries(REF_DOCS.map(d => [d.id, d]));

/** LOA inbound rules for a flight not yet in ZDC whose route crosses the giving ARTCC and ZDC. */
function inboundRules(f, ri, st) {
  if (st.key === "in") return [];
  const opts = {};
  if (ri) {
    opts.extraFixes = ri.all.map(a => a.name);
    const pts = (st.key === "inb" ? ri.ahead : ri.all).filter(a => a.ll);
    opts.viaArtcc = id => {
      let unknown = false;
      for (const a of pts) {
        const r = pointInArtcc(id, a.ll[0], a.ll[1]);
        if (r === true) return true;
        if (r == null) unknown = true;
      }
      return unknown ? null : false;
    };
  }
  // Where the route first enters an ARTCC (index into ri.all), for direction.
  const firstIn = id => ri ? ri.all.findIndex(a => a.ll && pointInArtcc(id, a.ll[0], a.ll[1]) === true) : -1;
  const zdcAt = firstIn("ZDC");
  return matchReference(f, INBOUND_ITEMS, opts).filter(({ item }) => {
    const t = `${item.title} ${item.restr || ""}`;
    if (/\bZDC (offline|closed)\b/i.test(t)) return false;
    // "ZNY offline: …" rules apply only while ZNY is offline, and only when the
    // giving facility is there to issue them (ZNY and ZBW both offline: nothing).
    const m = t.match(/\b(Z[A-Z]{2}|N90) (offline|closed)\b/i);
    if (m && (onlineSet.has(m[1].toUpperCase()) || !onlineSet.has(String(item.from).toUpperCase()))) return false;
    // Inbound only: drop when the route reaches ZDC before the giving ARTCC.
    const from = artccId(item.from);
    if (from && zdcAt >= 0) {
      const at = firstIn(from);
      if (at > zdcAt) return false;   // outbound through ZDC first; unknown (-1) stays
    }
    return true;
  });
}

/**
 * Does the route line pass through a ZDC sector? Uses the sector shapes drawn
 * on the map (vZDC split, any altitude) and needs ~6 nm of track inside, so
 * clipping a corner doesn't count. A sector with no shape, shapes not loaded
 * yet, or no expanded route: assume yes.
 */
function routeCrossesSector(ri) {
  const pts = ri ? ri.all.filter(a => a.ll).map(a => a.ll) : [];
  if (!zdcSectors || !zdcSectors.all.length || pts.length < 2) return () => true;
  let track = null;
  const memo = new Map();
  return sec => {
    const num = String(sec).padStart(2, "0");
    if (memo.has(num)) return memo.get(num);
    const test = sectorTest(num);
    let ok = true;
    if (test) {
      track = track || densify(gcPath(pts));
      let n = 0;
      for (const p of track) if (test(p) && ++n >= 3) break;
      ok = n >= 3;
    }
    memo.set(num, ok);
    return ok;
  };
}

function computeCards(qStr) {
  const cfgKey = $("cfgSel").value;
  const sec = $("secSel").value;
  const onlyZdc = $("optZdc").checked, partialOk = $("optPartial").checked, showPassed = $("optPassed").checked;
  const flights = flightsFromFeed();
  const cards = [];

  for (const f of flights) {
    // Cheap first pass on the filed route alone; expand the route only for candidates.
    const first = matchFlight(f, { ...geoCtx, config: cfgKey });
    if (!first.length && !matchReference(f, INBOUND_ITEMS).length) continue;
    const ri = routeInfo(f);
    const matches = ri ? matchFlight(f, { ...geoCtx, config: cfgKey, extraFixes: ri.all.map(a => a.name) }) : first;
    const st = flightStatus(f, ri);
    if (onlyZdc && st.outside) {
      const depIn = inZdc(ll(f.dep)) || inZdc(ll(f.arr));
      if (!(f.gs < 50 && depIn) && !(f.prefile && depIn)) continue;
    }
    const aheadNames = ri ? new Set(ri.ahead.map(a => a.name)) : null;
    const allNames = ri ? new Set(ri.all.map(a => a.name)) : null;
    const crosses = routeCrossesSector(ri);
    const rows = matches.filter(m => {
      if (!partialOk && m.quality !== "full") return false;
      // A crossing fix on the route places the restriction already; otherwise
      // the route line has to pass through the giving sector.
      if (!(m.fix && allNames && allNames.has(m.fix)) && !crosses(m.row[0])) return false;
      if (!sectorFilterPass(m.row, cfgKey, sec)) return false;
      m.passed = !!(m.fix && aheadNames && allNames.has(m.fix) && !aheadNames.has(m.fix) && !f.prefile && f.gs >= 50);
      if (m.passed && !showPassed) return false;
      return true;
    });
    const inbound = inboundRules(f, ri, st);
    if (!rows.length && !inbound.length) continue;
    const dv = descendViaFor(f);
    const hay = [f.callsign, f.dep, f.arr, f.route, f.type, ...rows.map(m => m.row.join(" ")),
      ...inbound.map(m => [m.item.from, m.item.restr, m.item.title].join(" "))].join(" ").toUpperCase();
    if (qStr && !qStr.split(/\s+/).every(w => hay.includes(w))) continue;
    cards.push({ f, st, rows, dv, ri, inbound });
  }

  const rank = { in: 0, inb: 1, gnd: 2, pre: 3, out: 4 };
  cards.sort((a, b) => (rank[a.st.key] - rank[b.st.key]) || a.f.callsign.localeCompare(b.f.callsign));
  return cards;
}

function setFeedStatus(cards) {
  const age = feedAt ? Math.round((Date.now() - feedAt) / 1000) : null;
  $("status").textContent = feedErr || (feed ? `${cards.length} aircraft · feed ${age}s ago` : "Loading VATSIM feed…");
  $("status").classList.toggle("err", !!feedErr);
}

function renderLive(qStr) {
  const sec = $("secSel").value;
  const cards = computeCards(qStr);
  setFeedStatus(cards);
  if (!feed) { $("out").innerHTML = `<p class="empty">Loading the VATSIM feed…</p>`; return; }
  if (!cards.length) {
    $("out").innerHTML = `<p class="empty">No aircraft on routes with ZDC SOP restrictions${qStr || sec ? " match these filters" : " right now"}.</p>`;
    return;
  }
  $("out").innerHTML = cards.map(renderCard).join("");
}

function sectorCell(id, cfgKey) {
  const s = /^\d$/.test(id) ? "0" + id : id;
  if (SECTORS[s]) {
    const owner = ownerOf(s, cfgKey);
    const ownerTxt = owner && owner !== s ? ` @ ${owner}` : "";
    return `${esc(s)}${esc(ownerTxt)} <span class="secname">${esc(SECTORS[s])}</span>`;
  }
  const name = FACILITY_NAMES[s] || (/z$/.test(s) ? `${s.slice(0, -1)} TRACON/ATCT` : "");
  return `${esc(s)}${name ? ` <span class="secname">${esc(name)}</span>` : ""}`;
}

/** Staffing chip for a facility whose status we can read from the feed, else "". */
function facilityChip(fac) {
  const id = String(fac || "").toUpperCase();
  if (!/^(Z[A-Z]{2}|N90)$/.test(id)) return "";
  return onlineSet.has(id) ? `<span class="tag in">${esc(id)} ONLINE</span>`
    : `<span class="tag off">${esc(id)} OFFLINE · issue it yourself</span>`;
}

function inboundHtml(inbound) {
  if (!inbound || !inbound.length) return "";
  const body = inbound.map(({ item, typeUnknown }) => {
    const doc = REF_DOC[item.doc];
    const notes = [item.title];
    if (typeUnknown) notes.push("aircraft type not classified");
    return `<tr><td class="hand">${esc(item.from)} <span class="arrow">→</span> ${esc(item.to)} ${facilityChip(item.from)}</td>` +
      `<td class="restr">${esc(item.restr || "see rule")}</td>` +
      `<td>${esc(notes.join(" · "))}<div class="note">${esc(item.text || "")}</div></td>` +
      `<td><span class="secname">${esc(doc ? doc.title : item.doc)} ${esc(item.ref || "")}</span></td></tr>`;
  }).join("");
  return `<div class="inbh">Inbound from outside ZDC · what the LOA says they hand you</div>` +
    `<table class="inb"><thead><tr><th>From → to</th><th>Expect</th><th>Rule</th><th>Source</th></tr></thead><tbody>${body}</tbody></table>`;
}

function renderCard({ f, st, rows, dv, inbound }) {
  const cfgKey = $("cfgSel").value;
  const cls = engineClass(f.type);
  const cruise = f.altitude ? String(f.altitude) : "";
  const now = f.alt != null ? `${Math.round(f.alt / 100).toString().padStart(3, "0")} · ${f.gs}kt` : "";
  const fixSet = new Set(rows.map(m => m.fix).filter(Boolean));
  rows.forEach(m => m.row[3].replace(/[\[\]()]/g, " ").split(/[\s/]+/).forEach(t => t && fixSet.add(t.replace("#", ""))));
  const routeHtml = String(f.route).split(/\s+/).map(tok => {
    const base = tok.split(/[./]/)[0].toUpperCase().replace(/\d[A-Z]?$/, "");
    const hit = fixSet.has(tok.toUpperCase()) || (base.length >= 3 && fixSet.has(base));
    return hit ? `<mark>${esc(tok)}</mark>` : esc(tok);
  }).join(" ");

  const body = rows.map(m => {
    const r = m.row;
    const notes = [...m.notes];
    if (m.how === "satellite") notes.push(`${f.arr} as satellite of ${r[1]}`);
    if (r[2]) notes.push(r[2]);
    if (m.typeUnknown) notes.push(`aircraft type ${f.type || "?"} not classified`);
    if (m.passed) notes.push("passed");
    return `<tr class="${m.quality}${m.passed ? " passed" : ""}">` +
      `<td class="hand">${sectorCell(r[0], cfgKey)} <span class="arrow">→</span> ${sectorCell(r[5], cfgKey)}</td>` +
      `<td class="restr">${esc(r[4])}</td>` +
      `<td>${esc(r[1])} ${esc(r[3])}${notes.length ? `<div class="note">${esc(notes.join(" · "))}</div>` : ""}</td>` +
      `<td><span class="q ${m.quality}">${m.quality === "full" ? "ROUTE" : "PARTIAL"}</span> <span class="secname">${esc(SECTOR_REF[r[0]] || "")}</span></td>` +
      `</tr>`;
  }).join("");

  const dvHtml = dv.length ? dv.map(d =>
    `<div class="dv">${esc(d.star)}#${d.via ? ` (${esc(d.via)})` : ""} descend via · bottom ${esc(d.alt)} (QQ P) · join by ${esc(d.join)}${d.handoff ? ` · handoff ${esc(d.handoff)}` : ""}</div>`).join("") : "";

  return `<div class="ac">` +
    `<div class="ac-head"><span class="cs">${esc(f.callsign)}</span>` +
    `<span class="meta"><b>${esc(f.dep)}</b> → <b>${esc(f.arr)}</b></span>` +
    `<span class="meta">${esc(f.type)}${cls ? ` · ${cls}` : ""}</span>` +
    `<span class="meta">filed ${esc(cruise)}${now ? ` · now ${esc(now)}` : ""}</span>` +
    `<span class="tag ${st.key}">${esc(st.label)}</span></div>` +
    `<div class="route">${routeHtml}</div>` +
    (rows.length ? `<table><thead><tr><th>Sector → to</th><th>Restriction</th><th>For / routing</th><th>Match</th></tr></thead><tbody>${body}</tbody></table>` : "") +
    inboundHtml(inbound) + dvHtml + `</div>`;
}

/* ---------------- reference view ---------------- */

function renderRef(qStr) {
  const cfgKey = $("cfgSel").value;
  const sec = $("secSel").value;
  const rows = ROWS.filter(r => rowVisibleInConfig(r, cfgKey) && sectorFilterPass(r, cfgKey, sec))
    .filter(r => !qStr || qStr.split(/\s+/).every(w => r.join(" ").toUpperCase().includes(w)));
  $("status").textContent = `${rows.length} of ${ROWS.length} restrictions`;
  $("status").classList.remove("err");
  if (!rows.length) { $("out").innerHTML = `<p class="empty">No SOP restrictions match these filters.</p>`; return; }
  $("out").innerHTML = `<div class="ref"><table><thead><tr><th>Sector → to</th><th>Restriction</th><th>For</th><th>Routing</th><th>Ref</th></tr></thead><tbody>` +
    rows.map(r => `<tr><td class="hand">${sectorCell(r[0], cfgKey)} <span class="arrow">→</span> ${sectorCell(r[5], cfgKey)}</td>` +
      `<td class="restr">${esc(r[4])}</td>` +
      `<td>${esc(r[1])}${r[2] ? ` <span class="note">${esc(r[2])}</span>` : ""}</td><td>${esc(r[3])}</td>` +
      `<td class="secname">${esc(SECTOR_REF[r[0]] || "")}</td></tr>`).join("") +
    `</tbody></table></div>`;
}

/* ---------------- SIDs view ---------------- */

function nmBetween(a, b) {
  const r = Math.PI / 180, dLat = (b[0] - a[0]) * r, dLon = (b[1] - a[1]) * r;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(a[0] * r) * Math.cos(b[0] * r) * Math.sin(dLon / 2) ** 2;
  return 3440 * 2 * Math.asin(Math.sqrt(h));
}

/** Pending IAD/DCA/BWI departures: on the ground at the field, or prefiled. */
function pendingDepartures() {
  if (!feed) return [];
  const out = [];
  const add = (p, prefile) => {
    const fp = p.flight_plan;
    const dep = fp && (fp.departure || "").toUpperCase();
    if (!dep || !SID_AIRPORTS[dep]) return;
    if (!prefile) {
      if (p.groundspeed >= 50) return;
      const at = ll(dep);
      if (at && nmBetween(at, [p.latitude, p.longitude]) > 6) return;
    }
    const d = departureSid(dep, fp.route);
    out.push({ callsign: p.callsign, dep, arr: (fp.arrival || "").toUpperCase(), type: fp.aircraft_short || fp.aircraft_faa || "",
      altitude: fp.altitude, route: fp.route || "", prefile, d });
  };
  (feed.pilots || []).forEach(p => add(p, false));
  (feed.prefiles || []).forEach(p => add(p, true));
  const order = Object.keys(SID_AIRPORTS);
  return out.sort((a, b) => (a.prefile - b.prefile) || (order.indexOf(a.dep) - order.indexOf(b.dep)) || a.callsign.localeCompare(b.callsign));
}

function sidChain(e, cfgKey) {
  const steps = e.steps.map(s => `${esc(s.fac)} <span class="secname">${esc(s.alt)}</span>`);
  const zdc = e.zdc ? `ZDC ${sectorCell(e.zdc.sec, cfgKey)}${e.zdc.alt ? ` <b class="sidalt">${esc(e.zdc.alt)}</b>` : ""}` : esc(e.note || "—");
  return [...steps, zdc].join(` <span class="arrow">→</span> `);
}

function renderSids(qStr) {
  const cfgKey = $("cfgSel").value;
  const match = txt => !qStr || qStr.split(/\s+/).every(w => txt.toUpperCase().includes(w));
  const deps = pendingDepartures().filter(x => match([x.callsign, x.dep, x.arr, x.type, x.route].join(" ")));
  const age = feedAt ? Math.round((Date.now() - feedAt) / 1000) : null;
  $("status").textContent = feedErr || (feed ? `${deps.length} pending departure${deps.length === 1 ? "" : "s"} · feed ${age}s ago` : "Loading VATSIM feed…");
  $("status").classList.toggle("err", !!feedErr);

  const depRows = deps.map(x => {
    const d = x.d;
    const sidTxt = d.sid ? `${esc(d.filed)}${d.trans ? ` <span class="secname">${esc(d.trans)}</span>` : ""}`
      : `<span class="note">${d.filed ? `no IAD/DCA/BWI SID (${esc(d.filed)})` : "no route"}</span>`;
    const entries = d.entries;
    const init = entries.length ? [...new Set(entries.map(e => e.init))].join(" / ") : "";
    const chain = entries.map(e => `${entries.length > 1 ? `<span class="secname">${esc(e.trans || "")}</span> ` : ""}${sidChain(e, cfgKey)}`).join("<br>");
    return `<tr><td><b>${esc(x.callsign)}</b>${x.prefile ? ` <span class="tag pre">PREFILE</span>` : ""}</td>` +
      `<td>${esc(x.dep.slice(1))} → ${esc(x.arr)}</td><td>${esc(x.type)}</td><td>${sidTxt}</td>` +
      `<td class="restr">${esc(init)}</td><td>${chain}</td><td>${esc(String(x.altitude || ""))}</td></tr>`;
  }).join("");
  const live = `<h2 class="sidh">Pending departures</h2>` + (deps.length
    ? `<div class="ref"><table><thead><tr><th>Callsign</th><th>Route</th><th>Type</th><th>SID</th><th>After takeoff</th><th>Climb-out → ZDC</th><th>Filed</th></tr></thead><tbody>${depRows}</tbody></table></div>`
    : `<p class="empty">${feed ? "No IAD, DCA or BWI departures waiting right now." : "Loading the VATSIM feed…"}</p>`);

  const refs = Object.entries(SIDS).map(([apt, list]) => {
    const rows = list.filter(e => match([apt, e.sid, e.trans || "", e.init, ...e.steps.map(s => s.fac), e.zdc ? e.zdc.sec : ""].join(" ")));
    if (!rows.length) return "";
    return `<h3 class="sidh">${esc(apt.slice(1))} <span class="secname">${esc(SID_AIRPORTS[apt].name)} · ${esc(SID_AIRPORTS[apt].area)}</span></h3>` +
      `<div class="ref"><table><thead><tr><th>SID</th><th>After takeoff</th><th>Climb-out → ZDC</th></tr></thead><tbody>` +
      rows.map(e => `<tr><td><b>${esc(e.sid)}</b>${e.trans ? ` <span class="secname">${esc(e.trans)}</span>` : ""}</td>` +
        `<td class="restr">${esc(e.init)}</td><td>${sidChain(e, cfgKey)}</td></tr>`).join("") +
      `</tbody></table></div>`;
  }).join("");
  $("out").innerHTML = live + `<h2 class="sidh">SID reference</h2>` + (refs || `<p class="empty">No SIDs match.</p>`) +
    `<p class="foot">From the ${esc(SID_SOURCE)}. C/V = climb via SID. A blank ZDC altitude is blank in the source table.</p>`;
}

/* ---------------- map view ---------------- */

const NEIGHBOR_ARTCCS = ["ZNY", "ZOB", "ZID", "ZTL", "ZJX", "ZBW"];
const STATUS_COLOR = { in: "#57d98a", inb: "#3fb7b0", gnd: "#8a97a3", pre: "#5c6b78", out: "#5c6b78" };
let lastSelCard = null;
let map = null, mapLayers = null, selected = "", fittedZdc = false, fittedSel = "";

function ensureMap() {
  if (map) { setTimeout(() => map.invalidateSize(), 0); return; }
  if (typeof L === "undefined") return;
  map = L.map("map", { zoomControl: false, minZoom: 4, maxZoom: 11 });
  L.control.zoom({ position: "bottomright" }).addTo(map);
  if (window.addVatflowBasemap) window.addVatflowBasemap(map);
  mapLayers = {
    bdry: L.layerGroup().addTo(map), sectors: L.layerGroup().addTo(map), route: L.layerGroup().addTo(map),
    fixes: L.layerGroup().addTo(map), traffic: L.layerGroup().addTo(map),
  };
  map.setView([38.3, -77.8], 6);
  map.on("click", () => { if (selected) { selected = ""; render(); } });
  map.on("zoomend", () => drawSectors(lastSelCard));
  drawBoundaries();
  loadSectors();
}

/* ZDC sector shapes: vZDC's own split, traced from the SOP's 1-3-1 Washington
   Center airspace diagram (data/vzdc-sectors.geojson, built by
   scripts/build-vzdc-sectors.py). ALL is every area a sector owns at any
   altitude; REGION features are the diagram's areas with their altitude bands. */
let strata = prefs.strata === "off" ? "off" : "on";
let zdcSectors = null;

function loadSectors() {
  if (zdcSectors) return;
  zdcSectors = { all: [], regions: [] };
  fetch("data/vzdc-sectors.geojson").then(r => (r.ok ? r.json() : null)).catch(() => null)
    .then(geo => {
      for (const ft of (geo && geo.features) || []) {
        const pr = ft.properties || {};
        const st = String(pr.stratum || "").toLowerCase();
        if (!ft.geometry || !(st in zdcSectors || st === "region")) continue;
        const polys = ft.geometry.type === "MultiPolygon" ? ft.geometry.coordinates : [ft.geometry.coordinates];
        const rings = polys.map(poly => poly[0].map(([lon, lat]) => [lat, lon]));
        if (st === "region") zdcSectors.regions.push({ bands: pr.bands || [], rings });
        else zdcSectors[st].push({ num: String(pr.sector || "").padStart(2, "0"), rings });
      }
      render();
    });
}

/** Every area a sector owns at any altitude. */
function sectorShape(num) {
  return zdcSectors ? zdcSectors.all.find(x => x.num === num) || null : null;
}

/* SOP diagram ids, for the area labels ("12 BRV 300A / 20 BKT 290B"). */
const SECTOR_IDS = { "05": "LDN", "09": "DIW", "12": "BRV", "17": "SWN", "19": "OOD", "20": "BKT", "32": "GVE", "36": "RDU",
  "37": "MAR", "51": "CAS", "52": "TEC", "54": "SBY", "58": "CYN", "59": "SIE" };

/** "12 BRV 300A" / "20 BKT 290B" / "17 SWN 180-230" / "05 LDN ALL" lines for one area, top band first. */
function bandLines(bands) {
  const top = Math.max(...bands.map(b => b.ceiling));
  return bands.slice().sort((a, b) => b.floor - a.floor).map(b => {
    const who = /^\d+$/.test(b.sector) ? `${b.sector} ${SECTOR_IDS[b.sector] || ""}`.trim() : b.sector;
    const alt = b.floor === 0 && b.ceiling === top ? "ALL" : b.ceiling === top ? `${b.floor}A` : b.floor === 0 ? `${b.ceiling}B` : `${b.floor}-${b.ceiling}`;
    return { sector: b.sector, text: `${who} ${alt}` };
  });
}

function sectorLabel(sec, cls) {
  const name = SECTORS[sec.num];
  const area = r => Math.abs(r.reduce((t, p, i) => { const q = r[(i + 1) % r.length]; return t + p[1] * q[0] - q[1] * p[0]; }, 0));
  const main = sec.rings.reduce((b, r) => (area(r) > area(b) ? r : b), sec.rings[0]);
  return L.marker(L.latLngBounds(main).getCenter(), {
    interactive: false,
    icon: L.divIcon({ className: "", iconSize: null, iconAnchor: [20, 8],
      html: `<div class="seclbl${cls ? " " + cls : ""}"><b>${esc(sec.num)}</b>${name ? `<br>${esc(name)}` : ""}</div>` }),
  });
}

/**
 * Sector layer: every vZDC area outlined and labelled like the SOP diagram
 * ("12 BRV 300A / 20 BKT 290B"); a label shows once its area is big enough on
 * screen. The selected aircraft's giving / receiving sectors are filled, and
 * their lines in the labels coloured to match.
 */
function drawSectors(card) {
  mapLayers.sectors.clearLayers();
  if (!zdcSectors) return "";
  const role = new Map();
  if (card) {
    for (const m of card.rows) {
      const give = m.row[0].padStart(2, "0"), recv = m.row[5];
      role.set(give, role.get(give) === "recv" ? "both" : "give");
      if (/^\d{1,2}$/.test(recv)) {
        const r = recv.padStart(2, "0");
        if (!role.has(r)) role.set(r, "recv");
        else if (role.get(r) === "give") role.set(r, "both");
      }
    }
  }
  const missing = [];
  for (const [num, rl] of role) {
    const sec = sectorShape(num);
    if (!sec) { missing.push(num); continue; }
    const color = rl === "recv" ? "#3fb7b0" : "#e8a838";
    sec.rings.forEach(r => L.polygon(r, { color, weight: 2, opacity: 0.9, fill: true, fillColor: color, fillOpacity: 0.14, interactive: false }).addTo(mapLayers.sectors));
    if (strata === "off") sectorLabel(sec, rl === "recv" ? "recv" : "give").addTo(mapLayers.sectors);
  }
  if (strata !== "off") {
    const placed = [];
    const ringArea = r => Math.abs(r.reduce((t, p, i) => { const q = r[(i + 1) % r.length]; return t + p[1] * q[0] - q[1] * p[0]; }, 0));
    const regs = zdcSectors.regions.map(reg => {
      const main = reg.rings.reduce((b, r) => (ringArea(r) > ringArea(b) ? r : b), reg.rings[0]);
      return { reg, main, size: ringArea(main) };
    }).sort((a, b) => b.size - a.size);
    for (const { reg, main } of regs) {
      reg.rings.forEach(r => L.polygon(r, { color: "#4a5d70", weight: 1, opacity: 0.7, fill: false, interactive: false }).addTo(mapLayers.sectors));
      const bounds = L.latLngBounds(main);
      const lines = bandLines(reg.bands).filter(l => /^\d+$/.test(l.sector) || reg.bands.length > 1);
      // Show the label only where its box fits inside the area and clears the labels already placed.
      const at = areaCenter(main, bounds), c = map.latLngToContainerPoint(at);
      const hw = Math.max(...lines.map(l => l.text.length)) * 3.1 + 2, hh = lines.length * 6 + 2;
      const box = { x0: c.x - hw, x1: c.x + hw, y0: c.y - hh, y1: c.y + hh };
      const ix = hw * 0.8, iy = hh * 0.8;  // the text may run a little over the area's lines
      const probes = [[c.x - ix, c.y - iy], [c.x + ix, c.y - iy], [c.x - ix, c.y + iy], [c.x + ix, c.y + iy], [c.x, c.y - iy], [c.x, c.y + iy], [c.x - ix, c.y], [c.x + ix, c.y]];
      if (!probes.every(([x, y]) => { const q = map.containerPointToLatLng([x, y]); return inRingLL([q.lat, q.lng], main); })) continue;
      if (placed.some(o => o.x0 < box.x1 && box.x0 < o.x1 && o.y0 < box.y1 && box.y0 < o.y1)) continue;
      placed.push(box);
      const html = lines.map(l => {
        const rl = role.get(l.sector);
        return `<div${rl ? ` class="${rl === "recv" ? "recv" : "give"}"` : ""}>${esc(l.text)}</div>`;
      }).join("");
      L.marker(at, { interactive: false, icon: L.divIcon({ className: "", iconSize: [0, 0], html: `<div class="arealbl">${html}</div>` }) })
        .addTo(mapLayers.sectors);
    }
  }
  if (!role.size) return "";
  return `<div class="legend"><i style="background:#e8a838"></i>sector giving a restriction · <i style="background:#3fb7b0"></i>sector receiving it` +
    (missing.length ? `<br>No sector shape for ${esc(missing.map(n => `${n} ${SECTORS[n] || ""}`.trim()).join(", "))}.` : "") + `</div>`;
}

/** A label point well inside the ring: the grid point farthest from its edges (on screen). */
function areaCenter(ring, bounds) {
  const px = ring.map(p => map.latLngToContainerPoint(p));
  const segDist = (x, y, a, b) => {
    const dx = b.x - a.x, dy = b.y - a.y, L2 = dx * dx + dy * dy;
    const t = L2 ? Math.max(0, Math.min(1, ((x - a.x) * dx + (y - a.y) * dy) / L2)) : 0;
    return Math.hypot(x - a.x - t * dx, y - a.y - t * dy);
  };
  let best = bounds.getCenter(), bd = -1;
  const N = 24;
  for (let i = 1; i < N; i++) for (let k = 1; k < N; k++) {
    const lat = bounds.getSouth() + (bounds.getNorth() - bounds.getSouth()) * i / N;
    const lng = bounds.getWest() + (bounds.getEast() - bounds.getWest()) * k / N;
    if (!inRingLL([lat, lng], ring)) continue;
    const c = map.latLngToContainerPoint([lat, lng]);
    let d = Infinity;
    for (let a = 0, b = px.length - 1; a < px.length; b = a++) d = Math.min(d, segDist(c.x, c.y, px[a], px[b]));
    if (d > bd) { bd = d; best = L.latLng(lat, lng); }
  }
  return best;
}

/** Width the floating detail panel covers on the map's right edge (0 when it sits below the map). */
function panelInset() {
  const p = $("mapPanel");
  return p && getComputedStyle(p).position === "absolute" ? p.offsetWidth + 10 : 0;
}

function drawBoundaries() {
  if (!map) return;
  mapLayers.bdry.clearLayers();
  for (const id of ["ZDC", ...NEIGHBOR_ARTCCS]) {
    const rings = getArtccRings(id);
    if (!rings) continue;
    const zdc = id === "ZDC";
    rings.forEach(r => L.polygon(r, {
      color: zdc ? "#e8a838" : "#3a4d5e", weight: zdc ? 1.5 : 1, opacity: zdc ? 0.6 : 0.8,
      fill: zdc, fillOpacity: 0.03, interactive: false,
    }).addTo(mapLayers.bdry));
    const b = getArtccBounds(id);
    if (b) {
      L.marker(L.latLngBounds(b).getCenter(), {
        interactive: false, icon: L.divIcon({ className: "artcc-label", html: id, iconSize: [34, 12] }),
      }).addTo(mapLayers.bdry);
    }
  }
  const zb = getArtccBounds("ZDC");
  if (zb && !fittedZdc) { map.fitBounds(zb, { padding: [10, 10] }); fittedZdc = true; }
}

function planeIcon(color, hdg, big) {
  const sz = big ? 18 : 12;
  return L.divIcon({
    className: "",
    iconSize: [sz, sz], iconAnchor: [sz / 2, sz / 2],
    html: `<div style="transform:rotate(${Number(hdg) || 0}deg);width:${sz}px;height:${sz}px">` +
      `<svg viewBox="0 0 24 24" width="${sz}" height="${sz}"><path d="M12 2 L19 21 L12 16.5 L5 21 Z" fill="${color}" stroke="#0a0e14" stroke-width="1.2"/></svg></div>`,
  });
}

/** Great-circle polyline through a list of [lat, lon]. */
function gcPath(lls) {
  let out = [];
  for (let i = 0; i < lls.length - 1; i++) {
    const seg = gcLine(lls[i], lls[i + 1]);
    if (i > 0) seg.shift();
    out = out.concat(seg);
  }
  return out;
}

/** Last point where a path leaves ZDC (for "BDRY" hand-offs to another ARTCC). */
function zdcExitPoint(path) {
  let exit = null;
  for (let i = 1; i < path.length; i++) {
    if (inZdc(path[i - 1]) && !inZdc(path[i])) exit = path[i - 1];
  }
  return exit;
}

/** Path densified to ~2 nm steps, so boundary crossings land close to the line. */
function densify(path) {
  const out = [];
  for (let i = 0; i < path.length; i++) {
    out.push(path[i]);
    const nx = path[i + 1];
    if (!nx) break;
    const n = Math.min(200, Math.ceil(Math.max(Math.abs(nx[0] - path[i][0]), Math.abs(nx[1] - path[i][1])) / 0.03));
    for (let k = 1; k < n; k++) out.push([path[i][0] + (nx[0] - path[i][0]) * k / n, path[i][1] + (nx[1] - path[i][1]) * k / n]);
  }
  return out;
}

function inRingLL(p, ring) {
  let inside = false;
  for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
    const [yi, xi] = ring[i], [yj, xj] = ring[j];
    if ((yi > p[0]) !== (yj > p[0]) && p[1] < ((xj - xi) * (p[0] - yi)) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
}

/** Test for "inside ZDC sector num" over every stratum's shape, or null with no shape. */
function sectorTest(num) {
  if (!zdcSectors) return null;
  const rings = zdcSectors.all.filter(x => x.num === num).flatMap(x => x.rings);
  return rings.length ? p => rings.some(r => inRingLL(p, r)) : null;
}

/** Index of the first point (from `start`) where the path goes from outside to inside `test`. */
function entryIndex(path, test, start = 0) {
  for (let i = Math.max(1, start); i < path.length; i++) if (!test(path[i - 1]) && test(path[i])) return i;
  return -1;
}

function fixLatLon(name, card) {
  const a = card.ri && card.ri.all.find(x => x.name === name && x.ll);
  if (a) return a.ll;
  const ref = card.f.lat != null ? [card.f.lat, card.f.lon] : ll(card.f.arr);
  try { const r = resolveToken(name, { refLL: ref, dep: card.f.dep, arr: card.f.arr }); return r ? r.ll : null; } catch (_) { return null; }
}

function drawSelected(card) {
  const { f, ri, rows } = card;
  const pos = f.lat != null && !f.prefile ? [f.lat, f.lon] : null;
  const allLL = ri ? ri.all.filter(a => a.ll).map(a => a.ll) : [ll(f.dep), pos, ll(f.arr)].filter(Boolean);
  const aheadLL = ri ? ri.ahead.filter(a => a.ll).map(a => a.ll) : [pos, ll(f.arr)].filter(Boolean);
  const full = gcPath(allLL), ahead = gcPath(aheadLL);
  if (full.length > 1) L.polyline(full, { color: "#8a97a3", weight: 1.5, opacity: 0.5, dashArray: "3 5", interactive: false }).addTo(mapLayers.route);
  if (ahead.length > 1) L.polyline(ahead, { color: "#e8a838", weight: 2.5, opacity: 0.85, interactive: false }).addTo(mapLayers.route);

  // One label per crossing point, listing every restriction at it.
  const cfgKey = $("cfgSel").value;
  const groups = new Map();
  const sopLine = m => ({ html: `${esc(m.row[4])} <span style="opacity:.7">${esc(ownerOf(m.row[0], cfgKey) || m.row[0])}→${esc(ownerOf(m.row[5], cfgKey) || m.row[5])}</span>`,
    passed: m.passed, full: m.quality === "full" });
  const add = (key, llPair, kind, m, head) => {
    if (!llPair) return;
    if (!groups.has(key)) groups.set(key, { ll: llPair, kind, head: head || key, items: [] });
    groups.get(key).items.push(m.html ? m : sopLine(m));
  };
  const track = densify(full.length ? full : allLL);
  // Inbound LOA rules sit where the route enters ZDC from the giving ARTCC.
  const zdcIn = entryIndex(track, p => inZdc(p));
  if (zdcIn >= 0) {
    for (const { item } of card.inbound || []) {
      const short = String(item.restr || "see rule").split(";")[0].trim();
      add("ZDCIN", track[zdcIn], "bdry", { html: `${esc(item.from)} ${esc(short)}`, passed: false, full: true }, "ZDC BDRY (in)");
    }
  }
  let exit;
  // Descend-via rows sit at the STAR's join-by fix (Ch 5 Sec 2) only when that
  // fix is on this route; a D/V handed to another facility outside ZDC (N90,
  // ZTL) otherwise sits where the route leaves ZDC, so the labels keep the
  // order the aircraft meets them.
  const dvJoin = card.dv && card.dv[0] ? card.dv[0].join : null;
  const onRoute = name => !!(ri && ri.all.some(x => x.name === name && x.ll));
  const external = to => /^(Z[A-Z]{2}|N90)$/.test(to);
  const atExit = m => {
    if (exit === undefined) exit = zdcExitPoint(full.length ? full : allLL);
    add("BDRY", exit, "bdry", m);
  };
  for (const m of rows) {
    if (m.fix) add(m.fix, fixLatLon(m.fix, card), "fix", m);
    else if (/^D\/V/.test(m.row[4])) {
      if (dvJoin && onRoute(dvJoin)) add(dvJoin, fixLatLon(dvJoin, card), "fix", m);
      else if (external(m.row[5])) atExit(m);
    } else if (external(m.row[5]) && /^(BDRY|AOB|AT|DSDG|FL)/.test(m.row[4])) atExit(m);
    else if (/^BDRY/.test(m.row[4]) && /^\d{1,2}$/.test(m.row[5])) {
      // Sector-to-sector boundary: where the route enters the receiving sector
      // after the giving one (FAA sector shapes, so approximate).
      const give = sectorTest(m.row[0].padStart(2, "0")), recv = m.row[5].padStart(2, "0"), recvTest = sectorTest(recv);
      if (!recvTest) continue;
      const from = give ? Math.max(0, entryIndex(track, give)) : 0;
      const at = entryIndex(track, recvTest, from);
      if (at >= 0) add(`SEC${recv}`, track[at], "sec", m, `SECTOR ${recv} BDRY`);
    }
  }
  for (const [key, g] of groups) {
    const allPassed = g.items.every(m => m.passed);
    const anyFull = g.items.some(m => m.full);
    const lines = g.items.map(m => m.html);
    const head = key === "BDRY" ? "ZDC BDRY" : esc(g.head);
    L.circleMarker(g.ll, { radius: 4, color: "#0a0e14", weight: 1, fillColor: g.kind === "bdry" ? "#3fb7b0" : "#e8a838", fillOpacity: 1 }).addTo(mapLayers.fixes);
    L.marker(g.ll, {
      interactive: false,
      icon: L.divIcon({
        className: "",
        iconSize: null,
        iconAnchor: [-8, 10],
        html: `<div class="fixlbl${g.kind === "bdry" ? " bdry" : ""}${anyFull ? "" : " partial"}${allPassed ? " passed" : ""}"><b>${head}</b><br>${lines.join("<br>")}</div>`,
      }),
    }).addTo(mapLayers.fixes);
  }

  if (fittedSel !== f.callsign) {
    fittedSel = f.callsign;
    // Frame the ZDC part of the trip: crossing points, route inside ZDC, and the
    // aircraft when it is close; a cross-country route otherwise zooms out to the coast.
    const zb = getArtccBounds("ZDC");
    const near = p => zb && L.latLngBounds(zb).pad(0.6).contains(p);
    const pts = [...[...groups.values()].map(g => g.ll), ...(ahead.length ? ahead : full).filter(p => inZdc(p))];
    if (pos && near(pos)) pts.push(pos);
    if (pts.length > 1) map.fitBounds(L.latLngBounds(pts), { paddingTopLeft: [40, 40], paddingBottomRight: [panelInset() + 40, 40], maxZoom: 8 });
    else if (zb) map.fitBounds(zb, { padding: [10, 10] });
  }
}

function renderMap(qStr) {
  ensureMap();
  const cards = computeCards(qStr);
  setFeedStatus(cards);
  const panel = $("mapPanel");
  if (!map) { panel.innerHTML = `<p class="hint">The map library did not load. Try reloading the page.</p>`; return; }
  mapLayers.traffic.clearLayers();
  mapLayers.route.clearLayers();
  mapLayers.fixes.clearLayers();
  const sel = cards.find(c => c.f.callsign === selected) || null;
  if (!sel) fittedSel = "";

  for (const c of cards) {
    if (c.f.lat == null || c.f.prefile) continue;
    const isSel = c === sel;
    const color = isSel ? "#e8a838" : STATUS_COLOR[c.st.key] || "#8a97a3";
    L.marker([c.f.lat, c.f.lon], { icon: planeIcon(color, c.f.hdg, isSel), zIndexOffset: isSel ? 1000 : 0, keyboard: false })
      .bindTooltip(`<b>${esc(c.f.callsign)}</b> ${esc(c.f.dep)}→${esc(c.f.arr)} · ${c.rows.length} restriction${c.rows.length === 1 ? "" : "s"}${c.inbound.length ? ` · ${c.inbound.length} inbound` : ""}`,
        { className: "cstip", direction: "top", offset: [0, -8] })
      .on("click", e => { L.DomEvent.stopPropagation(e); selected = c.f.callsign; render(); })
      .addTo(mapLayers.traffic);
  }
  $("strataSeg").querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.strata === strata));
  lastSelCard = sel;
  const legend = drawSectors(sel);
  panel.innerHTML = !feed ? `<p class="hint">Loading the VATSIM feed…</p>`
    : sel ? `<button type="button" class="pick" data-back="1">× Close</button>` + renderCard(sel) + legend
    : cards.length ? "" : `<p class="hint">No aircraft on routes with ZDC SOP restrictions match these filters.</p>`;
  // After the panel is filled, so the fit can leave room for it.
  if (sel) drawSelected(sel);
}

function render() {
  if (!started) return;
  const qStr = $("q").value.trim().toUpperCase();
  if (view === "ref") renderRef(qStr);
  else if (view === "sid") renderSids(qStr);
  else if (view === "map") renderMap(qStr);
  else renderLive(qStr);
}
</script>
</body>
</html>
